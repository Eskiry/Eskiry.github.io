<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT转JSON</title>
  <style>
    *{margin:0;padding:10px;box-sizing:border-box}
    body{font-family: monospace;background:#fff;color:#000;font-size:16px;}
    .box{max-width:800px;margin:20px auto;border:1px solid #000;padding:20px;}
    button{padding:8px 16px;margin:10px 0;cursor:pointer;font-family: monospace;}
    #status{color:#333;margin:10px 0;}
    /* 核心：让HTML识别\n换行 */
    #preview {
      margin: 15px 0;
      padding: 10px;
      border: 1px solid #666;
      min-height: 100px;
      white-space: pre-line;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3>TXT 转 JSON 工具</h3>
    <p>精准规则：空行分篇 | 仅篇章最后一行———/---开头为标题 | 正文破折号不识别</p>
    <input type="file" id="fileInput" accept=".txt">
    <button onclick="startConvert()">开始转换</button>
    <div id="status"></div>
    <div id="preview">预览区域：转换后会在这里显示正文（自动换行）</div>
    <button onclick="downloadJson()" style="display:none" id="downloadBtn">下载 JSON</button>
  </div>

  <script>
    let resultJson = [];

    function startConvert() {
      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('status');
      const downloadBtn = document.getElementById('downloadBtn');
      const preview = document.getElementById('preview');
      
      if (!fileInput.files.length) {
        status.textContent = "请选择TXT文件";
        preview.textContent = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = e => {
        parseText(e.target.result);
        status.textContent = `转换完成！共 ${resultJson.length} 条数据`;
        // ✅ 已删除多余的 --- 分隔符
        preview.textContent = resultJson.map(item => `标题：${item.title}\n正文：${item.body}`).join('\n\n');
        downloadBtn.style.display = "block";
      };
      reader.readAsText(fileInput.files[0], 'UTF-8');
    }

    // 核心解析
    function parseText(text) {
      resultJson = [];
      const passages = text.split(/\n\s*\n/)
        .map(item => item.trim())
        .filter(item => item);

      passages.forEach(passage => {
        const lines = passage.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        let title = "";
        let bodyContent = [];

        lines.forEach((line, idx) => {
          const isLastLine = idx === lines.length - 1;
          const isTitleLine = line.startsWith("———") || line.startsWith("---");

          if (isLastLine && isTitleLine) {
            title = line.replace("———", "").replace("---", "").trim();
          } else {
            bodyContent.push(line);
          }
        });

        // 保留换行符
        const body = bodyContent.join("\n").trim();
        
        if (body) {
          resultJson.push({
            title: title,
            body: body,
            labels: ["摘录"]
          });
        }
      });
    }

    // 下载JSON文件
    function downloadJson() {
      const jsonStr = JSON.stringify(resultJson, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "posts.json";
      a.click();
      document.getElementById("status").textContent = "posts.json 下载完成！";
    }
  </script>
</body>
</html>
