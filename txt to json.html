<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXT转JSON</title>
  <style>
    *{margin:0;padding:10px;box-sizing:border-box}
    body{font-family: monospace;background:#fff;color:#000;font-size:16px;}
    .box{max-width:800px;margin:20px auto;border:1px solid #000;padding:20px;}
    button{padding:8px 16px;margin:10px 0;cursor:pointer;font-family: monospace;}
    #status{color:#333;margin:10px 0;}
  </style>
</head>
<body>
  <div class="box">
    <h3>TXT 转 JSON 工具</h1>
    <p>精准规则：空行分篇 | 仅篇章最后一行———开头为标题 | 正文破折号不识别</p>
    <input type="file" id="fileInput" accept=".txt">
    <button onclick="startConvert()">开始转换</button>
    <div id="status"></div>
    <button onclick="downloadJson()" style="display:none" id="downloadBtn">下载 JSON</button>
  </div>

  <script>
    let resultJson = [];
    // 仅识别 单独成行、在段落末尾 的 ———
    const TITLE_SYMBOL = "———";

    function startConvert() {
      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('status');
      const downloadBtn = document.getElementById('downloadBtn');
      
      if (!fileInput.files.length) {
        status.textContent = "请选择TXT文件";
        return;
      }

      const reader = new FileReader();
      reader.onload = e => {
        parseText(e.target.result);
        status.textContent = `转换完成！共 ${resultJson.length} 条数据`;
        downloadBtn.style.display = "block";
      };
      reader.readAsText(fileInput.files[0], 'UTF-8');
    }

    // 核心解析：绝对精准，无任何误判
    function parseText(text) {
      resultJson = [];
      // 1. 按 空行 切割成独立篇章（最高优先级，绝不串篇）
      const passages = text.split(/\n\s*\n/)
        .map(item => item.trim())
        .filter(item => item);

      // 遍历每一篇内容
      passages.forEach(passage => {
        // 拆分当前篇章的所有行
        const lines = passage.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        let title = "";
        let bodyContent = [];

        // 遍历所有行，只把【最后一行的———】判定为标题
        lines.forEach((line, idx) => {
          const isLastLine = idx === lines.length - 1;
          const isTitleLine = line.startsWith(TITLE_SYMBOL);

          // 只有最后一行 + 以———开头 → 标题
          if (isLastLine && isTitleLine) {
            title = line.replace(TITLE_SYMBOL, "").trim();
          } else {
            // 其他所有行 → 纯正文（包含正文内的破折号，完全不处理）
            bodyContent.push(line);
          }
        });

        // 合并正文
        const body = bodyContent.join(" ").trim();
        
        // 保存有效数据
        if (body) {
          resultJson.push({
            title: title,
            body: body,
            labels: ["摘录"]
          });
        }
      });
    }

    // 下载JSON文件
    function downloadJson() {
      const jsonStr = JSON.stringify(resultJson, null, 2);
      const blob = new Blob([jsonStr], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "posts.json";
      a.click();
      document.getElementById("status").textContent = "posts.json 下载完成！";
    }
  </script>
</body>
</html>
