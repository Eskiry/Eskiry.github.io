<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog From Eskiry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #333333;
      --border: #eee;
      --card-bg: #f9f9f9;
      --code-bg: #f6f8fa;
      --mask-start: transparent;
      --mask-end: #fff;
      --btn-bg: #f1f1f1;
      --btn-text: #0969da;
      --sidebar-bg: #fafafa;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --text: #e5e5e5;
      --border: #2a2a2a;
      --card-bg: #1e1e1e;
      --code-bg: #2b2b2b;
      --mask-start: transparent;
      --mask-end: #121212;
      --btn-bg: #2a2a2a;
      --btn-text: #58a6ff;
      --sidebar-bg: #1a1a1a;
    }

    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {
      font-family: "Noto Serif SC", serif;
      line-height: 1.9;
      font-size: 17px;
      background-color: var(--bg);
      color: var(--text);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container {
      display: flex;
      min-height: 100vh;
      max-width: 1920px;
      margin: 0 auto;
    }

    .sidebar {
      width: 260px;
      background: var(--sidebar-bg);
      padding: 40px 20px;
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 22px;
      margin-bottom: 25px;
      text-align: center;
    }
    .category-item {
      padding: 10px 15px;
      margin: 6px 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
    }
    .category-item.active, .category-item:hover {
      background: var(--btn-bg);
      color: var(--btn-text);
    }

    .main {
      flex: 1;
      padding: 40px 5%;
    }

    .theme-btn {
      position: fixed;
      top: 20px;
      right: 5%;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      z-index: 99;
    }

    h1 {
      text-align: center;
      margin-bottom: 50px;
      font-weight: 600;
      font-size: 32px;
    }
    .post {
      padding: 35px 0;
      border-bottom: 1px solid var(--border);
    }

    /* 默认隐藏标题 */
    .post h2 {
      display: none;
      font-size: 26px;
      margin: 18px 0;
      color: inherit;
      font-weight: 600;
    }
    /* 文章展开后显示标题 */
    .post-content.expand ~ h2 {
      display: block;
    }

    /* 摘要高度翻倍 640px */
    .post-content {
      font-size: 18px;
      max-height: 640px;
      overflow: hidden;
      position: relative;
      transition: max-height 0.4s ease;
    }
    .post-content.expand {
      max-height: 3000px;
    }
    .post-content::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(to bottom, var(--mask-start), var(--mask-end));
      pointer-events: none;
    }
    .post-content.expand::after {
      display: none;
    }

    .post-content img {max-width: 100%; border-radius: 6px;}
    .post-content pre {
      background: var(--code-bg);
      padding: 18px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 18px 0;
      font-size: 16px;
    }
    .post-content code {
      background: var(--code-bg);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 16px;
    }

    .toggle-btn {
      display: inline-block;
      margin: 15px 0 0 0;
      padding: 8px 18px;
      background: var(--btn-bg);
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      color: var(--btn-text);
      border: none;
      font-family: inherit;
    }
    .toggle-btn:hover {
      opacity: 0.9;
    }

    /* 默认评论完全隐藏，不占位 */
    .comments {
      display: none;
      padding: 20px;
      background: var(--card-bg);
      border-radius: 10px;
      margin-top: 20px;
      max-height: 2000px;
      overflow: hidden;
    }
    /* 文章展开自动显示评论 */
    .post-content.expand ~ .comments {
      display: block;
    }

    .comment {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
    }
    .comment:last-child {
      border-bottom: none;
    }
    .comment-user {
      font-weight: bold;
      color: var(--btn-text);
      font-size: 18px;
    }
    .comment-content {
      margin-top: 6px;
      font-size: 17px;
    }
    .jump-comment {
      display: inline-block;
      margin-top: 12px;
      font-size: 16px;
      color: var(--btn-text);
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        position: relative;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <button class="theme-btn" id="themeBtn">夜间模式</button>

  <div class="container">
    <div class="sidebar" id="sidebar">
      <h2>文章分类</h2>
      <div class="category-item active" onclick="filterPosts('all')">全部文章</div>
    </div>

    <div class="main">
      <h1>Blog From Eskiry</h1>
      <div id="list"></div>
    </div>
  </div>

  <script>
    let allPosts = [];
    let allLabels = [];

    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('blog-theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.innerText = "日间模式";
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.hasAttribute('data-theme');
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('blog-theme', 'light');
        themeBtn.innerText = '夜间模式';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('blog-theme', 'dark');
        themeBtn.innerText = '日间模式';
      }
    });

    async function init() {
      await loadLabels();
      await loadPosts();
    }

    async function loadLabels() {
      const res = await fetch("https://api.github.com/repos/Eskiry/eskiry.github.io/labels");
      allLabels = await res.json();
      const sidebar = document.getElementById('sidebar');
      allLabels.forEach(label => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.innerText = label.name;
        div.onclick = () => filterPosts(label.name);
        sidebar.appendChild(div);
      });
    }

    async function loadPosts() {
      const res = await fetch("https://api.github.com/repos/Eskiry/eskiry.github.io/issues?per_page=100");
      allPosts = await res.json();
      renderPosts(allPosts);
    }

    function filterPosts(labelName) {
      document.querySelectorAll('.category-item').forEach(item => {
        item.classList.remove('active');
      });
      event.target.classList.add('active');

      let filtered = allPosts;
      if (labelName !== 'all') {
        filtered = allPosts.filter(post => 
          post.labels.some(l => l.name === labelName)
        );
      }
      renderPosts(filtered);
    }

    function renderPosts(posts) {
      let html = "";
      if (posts.length === 0) {
        html = "<p style='text-align:center;margin-top:50px;'>该分类下暂无文章</p>";
      } else {
        posts.forEach(art => {
          html += `
            <div class="post">
              <div class="post-content" id="body-${art.number}">
                ${marked.parse(art.body)}
              </div>
              <h2>${art.title}</h2>
              <button class="toggle-btn" onclick="toggleBody(${art.number})">阅读全文</button>
              <div class="comments" id="cmt-${art.number}">
                <p>加载评论中...</p>
                <a href="${art.html_url}" target="_blank" class="jump-comment">去 GitHub 发表评论 →</a>
              </div>
            </div>
          `;
        });
      }
      document.getElementById("list").innerHTML = html;
      posts.forEach(art => loadComments(art.number));
    }

    async function loadComments(issueNum) {
      const res = await fetch(`https://api.github.com/repos/Eskiry/eskiry.github.io/issues/${issueNum}/comments`);
      const comments = await res.json();
      let ch = "";
      if (comments.length === 0) {
        ch = "<p>暂无评论</p>";
      } else {
        comments.forEach(c => {
          ch += `
            <div class="comment">
              <div class="comment-user">${c.user.login}</div>
              <div class="comment-content">${marked.parse(c.body)}</div>
            </div>
          `;
        });
      }
      ch += `<a href="https://github.com/Eskiry/eskiry.github.io/issues/${issueNum}" target="_blank" class="jump-comment">去 GitHub 发表评论 →</a>`;
      document.getElementById(`cmt-${issueNum}`).innerHTML = ch;
    }

    // 展开/收起文章 自动控制评论显示隐藏
    function toggleBody(id){
      const el = document.getElementById(`body-${id}`);
      const btn = el.nextElementSibling.nextElementSibling;
      el.classList.toggle("expand");
      btn.innerText = el.classList.contains("expand") ? "收起" : "阅读全文";
    }

    init();
  </script>
</body>
</html>
