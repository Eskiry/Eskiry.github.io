<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Layi's Record</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #eee;
      --card-bg: #f9f9f9;
      --code-bg: #f7f7f7;
      --mask-end: #fff;
      --btn-bg: #f5f5f5;
      --btn-text: #0055cc;
      --muted: #444444;
      --sidebar-bg: #fafafa;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #f0f0f0;
      --border: #2a2a2a;
      --card-bg: #1e1e1e;
      --code-bg: #252525;
      --mask-end: #121212;
      --btn-bg: #252525;
      --btn-text: #69b1ff;
      --muted: #bbbbbb;
      --sidebar-bg: #1a1a1a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "Noto Serif SC", serif;
      line-height: 1.9;
      font-size: 17px;
      background: var(--bg);
      color: var(--text);
      transition: background-color 0.3s, color 0.3s;
      text-align: left;
    }
    .container { display: flex; min-height: 100vh; max-width: 1920px; margin: 0 auto; }

    /* 侧边栏 */
    .sidebar {
      width: 200px;
      background: var(--sidebar-bg);
      padding: 40px 15px;
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      text-align: center;
      transition: transform 0.3s ease;
      z-index: 99;
    }
    .sidebar-main { flex: 1; }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar h2 { font-size: 22px; margin-bottom: 25px; }
    
    .category-item {
      padding: 10px 12px;
      margin: 6px auto;
      border-radius: 8px;
      cursor: pointer;
      font-size: 17px;
      transition: 0.2s;
      width: 90%;
    }
    .category-item.active, .category-item:hover { background: var(--btn-bg); color: var(--btn-text); }
    
    .main { flex: 1; padding: 20px 5% 60px; transition: margin-left 0.3s; }

    /* 按钮与输入框 */
    .theme-btn, .random-mini-btn, .search-input {
      padding: 5px 10px;
      border-radius: 6px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
    }
    .search-input {
      border: 1px solid var(--border);
      color: var(--text);
      outline: none;
      width: 100%;
      cursor: text;
    }
    .search-input:focus { border-color: var(--btn-text); }

    /* 移动端菜单按钮 */
    .sidebar-toggle {
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      font-size: 14px;
      display: none;
    }

    .loading-tip { padding: 60px 0; color: var(--muted); font-size: 16px; }
    
    /* 文章样式 (更语义化的article) */
    .post { padding: 35px 0; border-bottom: 1px solid var(--border); position: relative; }
    .post h2 { font-size: 20px; font-weight: 600; margin: 0 0 18px 0; line-height: 1.4; }
    
    .post-content {
      font-size: 18px;
      position: relative;
      transition: max-height 0.4s;
    }
    .post-content.collapsible { max-height: 640px; overflow: hidden; }
    .post-content.collapsible::after {
      content: ""; position: absolute; left: 0; bottom: 0; width: 100%; height: 60px;
      background: linear-gradient(transparent, var(--mask-end)); pointer-events: none;
    }
    .post-content.expand { max-height: none; }
    .post-content.expand::after { display: none; }
    
    /* Markdown 元素内部样式 */
    .post-content img { max-width: 100%; border-radius: 6px; }
    .post-content pre, .post-content code { background: var(--code-bg); border-radius: 4px; }
    .post-content pre { padding: 18px; overflow-x: auto; margin: 18px 0; font-size: 16px; }
    .post-content code { padding: 3px 6px; font-size: 16px; }
    
    .toggle-btn {
      display: none;
      margin: 15px 0 0;
      padding: 6px 14px;
      background: var(--btn-bg);
      border-radius: 6px;
      cursor: pointer;
      color: var(--btn-text);
      border: none;
    }
    .post-content.collapsible ~ .toggle-btn, .post-content.expand ~ .toggle-btn { display: inline-block; }
    
    /* 分页 */
    .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 40px; flex-wrap: wrap; }
    .page-btn { padding: 6px 16px; border-radius: 6px; border: none; background: var(--btn-bg); color: var(--btn-text); cursor: pointer; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .jump-input { width: 60px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); text-align: center; }

    /* 移动端适配 */
    @media (max-width: 768px) {
      .sidebar-toggle { display: block; }
      .container { flex-direction: column; }
      .sidebar {
        width: 200px; height: 100vh; position: fixed; left: 0; top: 0;
        transform: translateX(-100%); border-bottom: none;
      }
      .sidebar.show { transform: translateX(0); }
      .main { padding: 20px 15px 40px; }
      .post { padding: 25px 0; }
      .post h2 { font-size: 18px; }
      .post-content { font-size: 16px; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="切换侧边栏菜单">菜单</button>

  <div class="container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-main">
        <h2>Layi's Records</h2>
        <div id="categoryContainer">
          <div class="category-item active" data-tag="all">全部文章</div>
          <!-- 标签由JS动态渲染 -->
        </div>
      </div>

      <div class="sidebar-footer">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索标题/正文关键词..." autocomplete="off">
        <button class="theme-btn" id="themeBtn">夜间模式</button>
        <button class="random-mini-btn" id="randomBtn">随机文章</button>
      </div>
    </aside>

    <main class="main">
      <div id="list" class="loading-tip">正在加载文章...</div>
      <div class="pagination" id="pagination"></div>
    </main>
  </div>

  <script>
    // 让 marked 自动解析 Markdown 里的回车换行，不需要自己手动 replace \n
    marked.use({ breaks: true });

    let allPosts = [], allLabels = [], filteredPosts = [];
    let currentPage = 1;
    const pageSize = 25, COLLAPSE_HEIGHT = 640;

    const DOM = {
      sidebar: document.getElementById('sidebar'),
      list: document.getElementById('list'),
      pagination: document.getElementById('pagination'),
      searchInput: document.getElementById('searchInput'),
      themeBtn: document.getElementById('themeBtn'),
      categoryContainer: document.getElementById('categoryContainer')
    };

    // 初始化
    function init() {
      initTheme();
      bindEvents();
      loadLocalPosts();
    }

    // 绑定所有的全局事件
    function bindEvents() {
      // 侧边栏开关
      document.getElementById('sidebarToggle').addEventListener('click', () => {
        DOM.sidebar.classList.toggle('show');
      });

      // 随机一篇文章
      document.getElementById('randomBtn').addEventListener('click', () => {
        if (!allPosts.length) return;
        filteredPosts = [allPosts[Math.floor(Math.random() * allPosts.length)]];
        currentPage = 1;
        renderPage();
      });

      // 搜索防抖 (停止打字 300ms 后再执行)
      let searchTimeout;
      DOM.searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => doSearch(e.target.value), 300);
      });

      // 侧边栏分类标签事件委托
      DOM.categoryContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('category-item')) {
          const tag = e.target.getAttribute('data-tag');
          filterPosts(tag, e.target);
        }
      });

      // 文章"展开/收起"事件委托
      DOM.list.addEventListener('click', (e) => {
        if (e.target.classList.contains('toggle-btn')) {
          const btn = e.target;
          const content = btn.previousElementSibling; // 获取同级的 post-content
          content.classList.toggle('expand');
          btn.textContent = content.classList.contains('expand') ? "收起" : "阅读全文";
        }
      });
    }

    // 初始化主题
    function initTheme() {
      const isDark = localStorage.getItem('theme') === 'dark';
      if (isDark) document.documentElement.setAttribute('data-theme', 'dark');
      DOM.themeBtn.textContent = isDark ? "日间模式" : "夜间模式";

      DOM.themeBtn.addEventListener('click', () => {
        const dark = document.documentElement.hasAttribute('data-theme');
        if (dark) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
          DOM.themeBtn.textContent = '夜间模式';
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
          DOM.themeBtn.textContent = '日间模式';
        }
      });
    }

    // 使用现代 fetch API 请求数据
    async function loadLocalPosts() {
      try {
        const res = await fetch('./posts.json');
        if (!res.ok) throw new Error('网络响应异常');
        
        allPosts = await res.json();
        const tagSet = new Set();
        
        allPosts.forEach(post => {
          (post.labels || []).forEach(tag => tagSet.add(tag));
        });
        
        allLabels = Array.from(tagSet);
        filteredPosts = [...allPosts];
        
        renderCategory();
        renderPage();
      } catch (err) {
        DOM.list.innerHTML = `<p class="loading-tip">加载失败：请检查 posts.json 文件是否存在或格式错误。</p>`;
      }
    }

    function doSearch(keyword) {
      keyword = keyword.trim().toLowerCase();
      currentPage = 1;
      if (!keyword) {
        filteredPosts = [...allPosts];
      } else {
        filteredPosts = allPosts.filter(post => 
          (post.title || '').toLowerCase().includes(keyword) || 
          (post.body || '').toLowerCase().includes(keyword)
        );
      }
      // 重置侧边栏高亮为“全部文章”
      resetCategoryActive('all');
      renderPage();
    }

    function renderCategory() {
      allLabels.forEach(tag => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = tag;
        div.setAttribute('data-tag', tag);
        DOM.categoryContainer.appendChild(div);
      });
    }

    function resetCategoryActive(activeTag) {
      const items = DOM.categoryContainer.querySelectorAll('.category-item');
      items.forEach(el => {
        if (el.getAttribute('data-tag') === activeTag) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });
    }

    function filterPosts(tag, targetEl) {
      resetCategoryActive(tag);
      if (DOM.searchInput.value) DOM.searchInput.value = ''; // 清空搜索框
      
      currentPage = 1;
      filteredPosts = tag === 'all' 
        ? [...allPosts] 
        : allPosts.filter(post => post.labels.includes(tag));
      
      renderPage();
    }

    function renderPage() {
      const total = Math.ceil(filteredPosts.length / pageSize);
      const start = (currentPage - 1) * pageSize;
      renderPosts(filteredPosts.slice(start, start + pageSize));
      renderPagination(total);
    }

    function renderPosts(posts) {
      if (!posts.length) {
        DOM.list.innerHTML = "<p class='loading-tip'>暂无匹配的文章</p>";
        return;
      }
      
      let html = '';
      posts.forEach(art => {
        // 由于配置了 marked.use({ breaks: true }), 不再需要 replace \n
        html += `
          <article class="post">
            <h2>${art.title}</h2>
            <div class="post-content">${marked.parse(art.body || '')}</div>
            <button class="toggle-btn">阅读全文</button>
          </article>`;
      });
      DOM.list.innerHTML = html;

      // 使用 requestAnimationFrame 等待 DOM 渲染完毕后再计算高度
      requestAnimationFrame(() => {
        const contents = DOM.list.querySelectorAll('.post-content');
        contents.forEach(el => {
          if (el.scrollHeight > COLLAPSE_HEIGHT) {
            el.classList.add('collapsible');
          }
        });
      });
    }

    function renderPagination(total) {
      if (total <= 1) {
        DOM.pagination.innerHTML = '';
        return;
      }
      
      DOM.pagination.innerHTML = `
        <button class="page-btn" id="prevBtn" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
        <span>${currentPage} / ${total}</span>
        <button class="page-btn" id="nextBtn" ${currentPage === total ? 'disabled' : ''}>下一页</button>
        <input type="number" class="jump-input" id="jumpInput" min="1" max="${total}" placeholder="页码">
        <button class="page-btn" id="jumpBtn">跳转</button>
      `;

      document.getElementById('prevBtn').onclick = () => turnPage(-1);
      document.getElementById('nextBtn').onclick = () => turnPage(1);
      
      const jumpInput = document.getElementById('jumpInput');
      const performJump = () => {
        const page = parseInt(jumpInput.value.trim());
        if (!isNaN(page)) {
          currentPage = Math.max(1, Math.min(page, total));
          renderPage();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
      
      document.getElementById('jumpBtn').onclick = performJump;
      jumpInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') performJump();
      });
    }

    function turnPage(delta) {
      currentPage += delta;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 启动应用
    init();
  </script>
</body>
</html>
