<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>layi's record</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #eee;
      --card-bg: #f9f9f9;
      --code-bg: #f7f7f7;
      --mask-end: #fff;
      --btn-bg: #f5f5f5;
      --btn-text: #0055cc;
      --muted: #444444;
      --sidebar-bg: #fafafa;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #f0f0f0;
      --border: #2a2a2a;
      --card-bg: #1e1e1e;
      --code-bg: #252525;
      --mask-end: #121212;
      --btn-bg: #252525;
      --btn-text: #69b1ff;
      --muted: #bbbbbb;
      --sidebar-bg: #1a1a1a;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:"Noto Serif SC",serif;
      line-height:1.9;
      font-size:17px;
      background:var(--bg);
      color:var(--text);
      transition:.3s;
      text-align:left;
    }
    .container{display:flex;min-height:100vh;max-width:1920px;margin:0 auto}

    .sidebar{
      width:200px;
      background:var(--sidebar-bg);
      padding:40px 15px;
      border-right:1px solid var(--border);
      position:sticky;
      top:0;
      height:100vh;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      text-align:center;
      transition: transform 0.3s ease;
      z-index: 99;
    }
    .sidebar-main{flex:1;}
    .sidebar-footer{
      margin-top:auto;
      padding-top:20px;
      border-top:1px solid var(--border);
      text-align:center;
      font-size:12px;
      color:var(--muted);
      line-height:1.8;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar h2{font-size:22px;margin-bottom:25px;text-align:center}
    .category-item{
      padding:10px 12px;
      margin:6px auto;
      border-radius:8px;
      cursor:pointer;
      font-size:17px;
      transition:.2s;
      width: 90%;
    }
    .category-item.active,.category-item:hover{background:var(--btn-bg);color:var(--btn-text)}
    .main{flex:1;padding:20px 5% 60px;text-align:left;transition: margin-left 0.3s;}

    .theme-btn,.random-mini-btn{
      padding:5px 10px;
      border-radius:6px;
      border:none;
      background:var(--btn-bg);
      color:var(--btn-text);
      cursor:pointer;
      font-size:12px;
      font-family:inherit;
    }
    .search-input{
      padding:5px 10px;
      border-radius:6px;
      border:1px solid var(--border);
      background:var(--btn-bg);
      color:var(--text);
      font-size:12px;
      font-family:inherit;
      outline: none;
      width: 100%;
      margin: 0 auto;
    }
    .search-input:focus{
      border-color: var(--btn-text);
    }

    .sidebar-toggle{
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      padding: 6px 12px;
      border-radius: 6px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      font-size: 14px;
      display: none;
    }

    .loading-tip{
      text-align:left;
      padding:60px 0;
      color:var(--muted);
      font-size:16px;
    }
    .post{
      padding:35px 0;
      border-bottom:1px solid var(--border);
      position:relative;
      text-align:left;
    }
    .post h2{
      font-size:20px;
      font-weight:600;
      margin:0 0 18px 0;
      color:var(--text);
      line-height:1.4;
      text-align:left;
    }
    .post-content{
      font-size:18px;
      position:relative;
      transition:max-height .4s;
      text-align:left;
      color:var(--text);
    }
    .post-content.collapsible{max-height:640px;overflow:hidden}
    .post-content.collapsible::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:60px;background:linear-gradient(transparent,var(--mask-end));pointer-events:none}
    .post-content.expand{max-height:3000px;overflow:visible}
    .post-content.expand::after{display:none}
    .post-content img{max-width:100%;border-radius:6px}
    .post-content pre,.post-content code{background:var(--code-bg);border-radius:4px}
    .post-content pre{padding:18px;overflow-x:auto;margin:18px 0;font-size:16px}
    .post-content code{padding:3px 6px;font-size:16px}
    .toggle-btn{
      display:none;
      margin:15px 0 0;
      padding:6px 14px;
      background:var(--btn-bg);
      border-radius:6px;
      cursor:pointer;
      color:var(--btn-text);
      border:none;
    }
    .post-content.collapsible~.toggle-btn{display:inline-block}
    .pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:40px;flex-wrap:wrap;}
    .page-btn{padding:6px 16px;border-radius:6px;border:none;background:var(--btn-bg);color:var(--btn-text);cursor:pointer}
    .page-btn:disabled{opacity:.5;cursor:not-allowed}
    .jump-input{width:50px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);text-align:center;}

    /* 本地文件降级选择框样式 */
    #fallbackBox {
      padding: 25px;
      border: 2px dashed var(--btn-text);
      border-radius: 8px;
      background: var(--card-bg);
      margin-top: 50px;
    }
    #fallbackBox input[type="file"] {
      margin-top: 10px;
      color: var(--text);
    }

    @media (max-width: 768px) {
      .sidebar-toggle{display: block;}
      .container {flex-direction: column;}
      .sidebar {
        width: 200px;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        border-right: 1px solid var(--border);
        border-bottom: none;
      }
      .sidebar.show {
        transform: translateX(0);
      }
      .main {
        padding: 20px 15px 40px;
      }
      .post {padding: 25px 0;}
      .post h2 {font-size: 18px;}
      .post-content {font-size: 16px;}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <button class="sidebar-toggle" id="sidebarToggle">菜单</button>

  <div class="container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-main">
        <h2>Layi's Records</h2>
        <div class="category-item active" onclick="filterPosts('all')">全部文章</div>
      </div>

      <div class="sidebar-footer">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索标题/正文关键词...">
        <button class="theme-btn" id="themeBtn">日间模式</button>
        <button class="random-mini-btn" onclick="showRandomPost()">随机</button>
      </div>
    </div>

    <div class="main">
      <div id="list" class="loading-tip">正在加载文章...</div>
      
      <div id="fallbackBox" style="display: none;">
        <h3 style="margin-bottom: 10px; color: var(--btn-text);">⚠️ 无法自动加载 posts.json</h3>
        <p style="font-size: 15px; color: var(--muted); margin-bottom: 12px;">
          常见原因：双击本地打开 HTML 受到浏览器的跨域安全限制 (CORS)。
        </p>
        <p style="font-size: 15px;"><b>请点击下方按钮，手动选择你本地的 <code>posts.json</code> 文件：</b></p>
        <input type="file" id="localJsonFile" accept=".json" onchange="loadUserLocalJson(this)">
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    var allPosts = [], allLabels = [], filteredPosts = [];
    var currentPage = 1;
    var pageSize = 25, COLLAPSE_HEIGHT = 640;
    var searchInput = null, searchTimer = null;

    document.getElementById('sidebarToggle').onclick = function(){
      document.getElementById('sidebar').classList.toggle('show');
    };

    function showRandomPost() {
      if(!allPosts || allPosts.length === 0) return;
      var post = allPosts[Math.floor(Math.random() * allPosts.length)];
      filteredPosts = [post];
      currentPage = 1;
      renderPage();
    }

    var themeBtn = document.getElementById('themeBtn');
    var savedTheme = localStorage.getItem('theme');
    if(savedTheme === 'light'){
      document.documentElement.removeAttribute('data-theme');
      themeBtn.textContent = "夜间模式";
    }else{
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = "日间模式";
    }

    themeBtn.onclick = function() {
      var dark = document.documentElement.hasAttribute('data-theme');
      if (dark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '夜间模式';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '日间模式';
      }
    };

    function initSearch() {
      searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(doSearch, 200); 
      });
    }

    function doSearch() {
      var keyword = searchInput.value.trim().toLowerCase();
      currentPage = 1;
      if (!keyword) {
        filteredPosts = allPosts.slice();
        renderPage();
        return;
      }
      filteredPosts = allPosts.filter(function(post) {
        var title = (post.title || '').toLowerCase();
        var body = (post.body || '').toLowerCase();
        return title.indexOf(keyword) !== -1 || body.indexOf(keyword) !== -1; 
      });
      renderPage();
    }

    function init() {
      loadLocalPosts();
      initSearch();
    }

    // 核心处理函数：解析并构建数据
    function processPostsData(rawData) {
      allPosts = rawData;
      var tagSet = new Set();
      for (var i = 0; i < allPosts.length; i++) {
        var labels = allPosts[i].labels || []; 
        for (var j = 0; j < labels.length; j++) {
          tagSet.add(labels[j]);
        }
      }
      allLabels = Array.from(tagSet);
      
      filteredPosts = allPosts.slice();
      renderPage();
      renderCategory();
    }

    function loadLocalPosts() {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', './posts.json', true);
      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200) {
            try {
              var parsedData = JSON.parse(xhr.responseText);
              processPostsData(parsedData);
            } catch (e) {
              showFallback("加载失败：JSON 解析错误");
            }
          } else {
            showFallback("加载失败：请检查 posts.json 文件是否存在");
          }
        }
      };
      // 针对部分由于跨域或无服务直接触发 onerror 的情况
      xhr.onerror = function() {
        showFallback("加载失败：网络或跨域受限");
      };
      xhr.send(null);
    }

    // 触发降级显示
    function showFallback(msg) {
      document.getElementById('list').innerHTML = '';
      document.getElementById('fallbackBox').style.display = 'block';
    }

    // 用户通过本地文件选择框引入 posts.json
    function loadUserLocalJson(inputElement) {
      const file = inputElement.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.readAsText(file, 'UTF-8');
      reader.onload = function(e) {
        try {
          const parsedData = JSON.parse(e.target.result);
          if(!Array.isArray(parsedData)) {
            alert('解析失败：JSON 根节点必须是数组格式！');
            return;
          }
          // 隐藏降级提示框
          document.getElementById('fallbackBox').style.display = 'none';
          processPostsData(parsedData);
        } catch (err) {
          alert('JSON 解析失败，请确认选择的是正确的 posts.json 文件。');
        }
      };
    }

    function renderCategory() {
      var side = document.getElementById('sidebar').querySelector('.sidebar-main');
      var fragment = document.createDocumentFragment(); 
      for (var i = 0; i < allLabels.length; i++) {
        var tag = allLabels[i];
        var div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = tag;
        div.onclick = function() {
          filterPosts(this.textContent);
        };
        fragment.appendChild(div);
      }
      side.appendChild(fragment); 
    }

    function filterPosts(tag) {
      var items = document.querySelectorAll('.category-item');
      for (var i = 0; i < items.length; i++) {
        items[i].classList.remove('active');
      }
      var activeEl = event ? event.target : this;
      activeEl.classList.add('active');
      
      if(searchInput) searchInput.value = '';
      
      currentPage = 1;
      if (tag === 'all') {
        filteredPosts = allPosts.slice();
      } else {
        filteredPosts = [];
        for (var i = 0; i < allPosts.length; i++) {
          if ((allPosts[i].labels || []).indexOf(tag) !== -1) {
            filteredPosts.push(allPosts[i]);
          }
        }
      }
      renderPage();
    }

    function renderPage() {
      var total = Math.ceil(filteredPosts.length / pageSize);
      var start = (currentPage - 1) * pageSize;
      renderPosts(filteredPosts.slice(start, start + pageSize));
      renderPagination(total);
    }

    function renderPosts(posts) {
      var listEl = document.getElementById('list');
      if (posts.length === 0) {
        listEl.innerHTML = "<p style='text-align:left;margin-top:50px;color:var(--text)'>暂无匹配的文章</p>";
        return;
      }
      
      var html = '';
      for (var i = 0; i < posts.length; i++) {
        var art = posts[i];
        var id = i + 1;
        var bodyWithBr = (art.body || '').replace(/\n/g, '<br>'); 
        html += '<div class="post"><h2>' + (art.title || '') + '</h2><div class="post-content" id="b' + id + '">' + marked.parse(bodyWithBr) + '</div><button class="toggle-btn" id="tb' + id + '" onclick="toggleBody(' + id + ')">阅读全文</button></div>';
      }
      listEl.innerHTML = html; 

      var contents = listEl.querySelectorAll('.post-content');
      for (var k = 0; k < contents.length; k++) {
        if (contents[k].scrollHeight > COLLAPSE_HEIGHT) {
          contents[k].classList.add("collapsible");
        }
      }
    }

    function toggleBody(id) {
      var el = document.getElementById('b' + id);
      var btn = document.getElementById('tb' + id);
      el.classList.toggle("expand");
      if (el.classList.contains("expand")) {
        btn.textContent = "收起";
        el.classList.remove("collapsible");
      } else {
        btn.textContent = "阅读全文";
        if (el.scrollHeight > COLLAPSE_HEIGHT) {
          el.classList.add("collapsible");
        }
      }
    }

    function jumpToPage() {
      var total = Math.ceil(filteredPosts.length / pageSize);
      var input = document.getElementById('jumpInput');
      var page = parseInt(input.value.trim());
      
      if (isNaN(page)) return;
      page = Math.max(1, Math.min(page, total));
      currentPage = page;
      renderPage();
      scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPagination(total) {
      var wrap = document.getElementById('pagination');
      if (total <= 1) {
        wrap.innerHTML = '';
        return;
      }
      
      wrap.innerHTML = '<button class="page-btn" onclick="prev()" ' + (currentPage === 1 ? 'disabled' : '') + '>上一页</button><span>' + currentPage + '/' + total + '</span><button class="page-btn" onclick="next()" ' + (currentPage === total ? 'disabled' : '') + '>下一页</button><input type="number" class="jump-input" id="jumpInput" min="1" max="' + total + '" placeholder="页码" /><button class="page-btn" onclick="jumpToPage()">跳转</button>';
      
      document.getElementById('jumpInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') jumpToPage();
      });
    }

    function prev() { 
      currentPage--; 
      renderPage(); 
      scrollTo({top:0,behavior:'smooth'});
    }
    function next() { 
      currentPage++; 
      renderPage(); 
      scrollTo({top:0,behavior:'smooth'});
    }
    
    init();
  </script>
</body>
</html>
