<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eskiry's Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff;
      --text: #333;
      --border: #eee;
      --card-bg: #f9f9f9;
      --code-bg: #f7f7f7;
      --mask-end: #fff;
      --btn-bg: #f5f5f5;
      --btn-text: #0969da;
      --muted: #aaa;
      --sidebar-bg: #fafafa;
      --action-bg: rgba(240,240,240,0.4);
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #e5e5e5;
      --border: #2a2a2a;
      --card-bg: #1e1e1e;
      --code-bg: #252525;
      --mask-end: #121212;
      --btn-bg: #252525;
      --btn-text: #58a6ff;
      --muted: #888;
      --sidebar-bg: #1a1a1a;
      --action-bg: rgba(40,40,40,0.35);
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Noto Serif SC",serif;line-height:1.9;font-size:17px;background:var(--bg);color:var(--text);transition:.3s}
    .container{display:flex;min-height:100vh;max-width:1920px;margin:0 auto}
    .sidebar{
      width:260px;
      background:var(--sidebar-bg);
      padding:40px 20px;
      border-right:1px solid var(--border);
      position:sticky;
      top:0;
      height:100vh;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
    }
    .sidebar-main{flex:1;}
    .sidebar-footer{
      margin-top:auto;
      padding-top:20px;
      border-top:1px solid var(--border);
      text-align:center;
      font-size:12px;
      color:var(--muted);
      line-height:1.8;
    }
    .sidebar h2{font-size:22px;margin-bottom:25px;text-align:center}
    .category-item{padding:10px 15px;margin:6px 0;border-radius:8px;cursor:pointer;font-size:17px;transition:.2s}
    .category-item.active,.category-item:hover{background:var(--btn-bg);color:var(--btn-text)}
    .main{flex:1;padding:20px 5% 60px}
    .theme-btn,.random-mini-btn{
      margin:4px;
      padding:5px 10px;
      border-radius:6px;
      border:none;
      background:var(--btn-bg);
      color:var(--btn-text);
      cursor:pointer;
      font-size:12px;
      font-family:inherit;
      display:inline-block;
    }
    .loading-tip{text-align:center;padding:60px 0;color:var(--muted);font-size:16px}
    .post{padding:35px 0;border-bottom:1px solid var(--border);position:relative}
    .post h2{
      font-size:19px;
      font-weight:600;
      margin:0 0 18px 0;
      opacity:.98;
      line-height:1.4;
    }
    .post-action-bar{
      position:absolute;
      right:0;
      bottom:10px;
      display:flex;
      gap:6px;
      align-items:center;
    }
    .data-box{
      display:inline-flex;
      align-items:center;
      gap:3px;
      padding:2px 7px;
      background:var(--action-bg);
      border-radius:4px;
      color:var(--muted);
      font-size:12px;
      border:none;
    }
    .like-box,.cmt-btn{cursor:default}
    .post-content{font-size:18px;position:relative;transition:max-height .4s}
    .post-content.collapsible{max-height:640px;overflow:hidden}
    .post-content.collapsible::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:60px;background:linear-gradient(transparent,var(--mask-end));pointer-events:none}
    .post-content.expand{max-height:3000px;overflow:visible}
    .post-content.expand::after{display:none}
    .post-content img{max-width:100%;border-radius:6px}
    .post-content pre,.post-content code{background:var(--code-bg);border-radius:4px}
    .post-content pre{padding:18px;overflow-x:auto;margin:18px 0;font-size:16px}
    .post-content code{padding:3px 6px;font-size:16px}
    .toggle-btn{display:none;margin:15px 0 0;padding:6px 14px;background:var(--btn-bg);border-radius:6px;cursor:pointer;color:var(--btn-text);border:none}
    .post-content.collapsible~.toggle-btn{display:inline-block}
    .comments{display:none;padding:12px;background:var(--card-bg);border-radius:8px;margin-top:16px;font-size:13px}
    .comments.open{display:block}
    .comment{padding:8px 0;border-bottom:1px solid var(--border);line-height:1.6}
    .comment:last-child{border-bottom:none}
    .comment-user{font-weight:bold;color:var(--btn-text);font-size:14px}
    .jump-comment{display:inline-block;margin-top:8px;font-size:12px;color:var(--btn-text);text-decoration:none}
    .pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:40px}
    .page-btn{padding:6px 16px;border-radius:6px;border:none;background:var(--btn-bg);color:var(--btn-text);cursor:pointer}
    .page-btn:disabled{opacity:.5;cursor:not-allowed}
    @media (max-width:768px){
      .container{flex-direction:column}
      .sidebar{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--border);position:relative;padding:20px 15px}
      .category-item{font-size:18px;padding:12px 15px}
      .sidebar-footer{margin-top:20px;padding-top:15px;}
      .main{padding:15px 4% 40px}
      .post{padding:25px 0}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-main">
        <h2>Eskiry's Blog</h2>
        <div class="category-item active" onclick="filterPosts('all')">全部文章</div>
      </div>

      <div class="sidebar-footer">
        <button class="theme-btn" id="themeBtn">日间模式</button>
        <button class="random-mini-btn" onclick="showRandomPost()">随机</button>
        <div>最新更新：<span id="lastUpdate">加载中...</span></div>
        <div>访问：<span id="site_pv">0</span> 次 · 访客：<span id="site_uv">0</span> 人</div>
      </div>
    </div>

    <div class="main">
      <div id="list" class="loading-tip">正在加载文章...</div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    let allPosts = [], allLabels = [], filteredPosts = [];
    let currentPage = 1;
    const pageSize = 25, COLLAPSE_HEIGHT = 640;

    // 随机文章
    function showRandomPost() {
      if(!allPosts || allPosts.length === 0) return;
      const post = allPosts[Math.floor(Math.random() * allPosts.length)];
      filteredPosts = [post];
      currentPage = 1;
      renderPage();
    }

    // 本地PV/UV统计
    function initStats() {
      let pv = +localStorage.getItem('pv') + 1 || 1;
      localStorage.setItem('pv', pv);
      document.getElementById('site_pv').textContent = pv;

      let uid = localStorage.getItem('site_uid');
      if(!uid){
        uid = 'uv_' + Date.now() + Math.random().toString(36).slice(2);
        localStorage.setItem('site_uid', uid);
        localStorage.setItem('uv', 1);
      }
      let uv = +localStorage.getItem('uv') || 1;
      document.getElementById('site_uv').textContent = uv;
    }

    // 主题初始化
    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('theme');
    if(savedTheme === 'light'){
      document.documentElement.removeAttribute('data-theme');
      themeBtn.textContent = "夜间模式";
    }else{
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = "日间模式";
    }

    themeBtn.onclick = () => {
      const dark = document.documentElement.hasAttribute('data-theme');
      if (dark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '夜间模式';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '日间模式';
      }
    };

    async function init() {
      await loadLocalPosts();
      renderCategory();
      showLastUpdate();
      initStats();
    }

    // 最新更新时间
    function showLastUpdate() {
      if (!allPosts.length) return;
      const latest = allPosts.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))[0];
      const time = new Date(latest.updated_at).toLocaleDateString('zh-CN', {year: 'numeric', month: '2-digit', day: '2-digit'});
      document.getElementById('lastUpdate').textContent = time;
    }

    // 加载本地 posts.json 代替 GitHub API
    async function loadLocalPosts() {
      try {
        const res = await fetch('./posts.json');
        if (!res.ok) throw new Error('读取文章配置失败');
        allPosts = await res.json();
        // 提取所有分类标签
        let tagSet = new Set();
        allPosts.forEach(p => p.labels.forEach(t => tagSet.add(t)));
        allLabels = Array.from(tagSet);

        filteredPosts = [...allPosts];
        renderPage();
      } catch (e) {
        document.getElementById('list').innerHTML = `<p style='text-align:center;margin-top:50px;color:var(--muted)'>加载失败：${e.message}<br>请检查 posts.json 文件是否存在</p>`;
      }
    }

    // 渲染侧边栏分类
    function renderCategory() {
      const side = document.getElementById('sidebar').querySelector('.sidebar-main');
      allLabels.forEach(tag => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = tag;
        div.onclick = () => filterPosts(tag);
        side.appendChild(div);
      });
    }

    // 分类筛选
    function filterPosts(tag) {
      document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
      event.target.classList.add('active');
      currentPage = 1;
      filteredPosts = tag === 'all' ? [...allPosts] : allPosts.filter(p => p.labels.includes(tag));
      renderPage();
    }

    function renderPage() {
      const total = Math.ceil(filteredPosts.length / pageSize);
      const start = (currentPage - 1) * pageSize;
      renderPosts(filteredPosts.slice(start, start + pageSize));
      renderPagination(total);
    }

    function renderPosts(posts) {
      if (!posts.length) {
        document.getElementById('list').innerHTML = "<p style='text-align:center;margin-top:50px;color:var(--muted)'>该分类下暂无文章</p>";
        return;
      }
      let html = '';
      posts.forEach((art, idx) => {
        const id = idx + 1;
        html += `
          <div class="post">
            <h2>${art.title}</h2>
            <div class="post-content" id="b${id}">${marked.parse(art.body)}</div>
            <div class="post-action-bar">
              <div class="data-box like-box">♡ <span>0</span></div>
              <button class="data-box cmt-btn" onclick="toggleCmt(${id})">💬 <span>0</span></button>
            </div>
            <button class="toggle-btn" id="tb${id}" onclick="toggleBody(${id})">阅读全文</button>
            <div class="comments" id="cmt${id}">
              <p>静态博客暂无评论功能</p>
            </div>
          </div>`;
      });
      document.getElementById('list').innerHTML = html;
      posts.forEach((_, idx) => { 
        const id = idx + 1;
        setTimeout(()=>checkCollapse(id),0) 
      });
    }

    function toggleCmt(id) { 
      document.getElementById(`cmt${id}`).classList.toggle("open") 
    }

    function toggleBody(id) {
      const el = document.getElementById(`b${id}`);
      const btn = document.getElementById(`tb${id}`);
      el.classList.toggle("expand");
      if(el.classList.contains("expand")){
        btn.textContent = "收起";
        el.classList.remove("collapsible");
      }else{
        btn.textContent = "阅读全文";
        setTimeout(()=>checkCollapse(id),0);
      }
    }

    function checkCollapse(id) {
      const el = document.getElementById(`b${id}`);
      el.style.maxHeight = 'none';
      if (el.scrollHeight > COLLAPSE_HEIGHT) {
        el.classList.add("collapsible");
      } else {
        el.classList.remove("collapsible");
      }
      el.style.maxHeight = '';
    }

    function renderPagination(total) {
      const wrap = document.getElementById('pagination');
      total <= 1 ? wrap.innerHTML = '' : wrap.innerHTML = `
        <button class="page-btn" onclick="prev()" ${currentPage===1?'disabled':''}>上一页</button>
        <span>${currentPage}/${total}</span>
        <button class="page-btn" onclick="next()" ${currentPage===total?'disabled':''}>下一页</button>`;
    }

    function prev() { currentPage--; renderPage(); scrollTo({top:0,behavior:'smooth'}) }
    function next() { currentPage++; renderPage(); scrollTo({top:0,behavior:'smooth'}) }
    init();
  </script>
</body>
</html>
