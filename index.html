<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog From Eskiry</title>
  <style>
    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {
      max-width: 850px;
      margin: 0 auto;
      padding: 40px 20px;
      font-family: "Noto Sans SC", sans-serif;
      line-height: 1.8;
      color: #333;
      background: #fff;
    }
    h1 {
      text-align: center;
      margin-bottom: 50px;
      font-weight: 600;
    }
    .post {
      padding: 30px 0;
      border-bottom: 1px solid #eee;
    }
    .post h2 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #222;
    }
    .post-content {
      font-size: 16px;
      margin-bottom: 20px;
    }
    .post-content img {max-width: 100%; border-radius: 6px;}
    .post-content pre {
      background: #f6f8fa;
      padding: 16px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 15px 0;
    }
    .post-content code {
      background: #f6f8fa;
      padding: 2px 5px;
      border-radius: 4px;
    }
    /* 评论区样式 */
    .comments {
      padding: 20px;
      background: #f9f9f9;
      border-radius: 8px;
      margin-top: 20px;
    }
    .comment {
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .comment-user {
      font-weight: bold;
      color: #0969da;
    }
    .comment-content {
      margin-top: 5px;
      font-size: 14px;
    }
    .comment-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 16px;
      background: #0969da;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
    }
    .comment-btn:hover {
      background: #0657bd;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <h1>Blog From Eskiry</h1>
  <div id="list"></div>

  <script>
    // 获取所有文章（Issue）
    fetch("https://api.github.com/repos/Eskiry/eskiry.github.io/issues?per_page=100")
    .then(res => res.json())
    .then(data => {
      let html = "";
      data.forEach(art => {
        // 文章主体
        html += `
          <div class="post">
            <h2>${art.title}</h2>
            <div class="post-content">${marked.parse(art.body)}</div>
            
            <!-- Issue 评论区 -->
            <div class="comments" id="comments-${art.number}">
              <p>加载评论中...</p>
            </div>
            
            <!-- 一键跳转到 Issue 发表评论 -->
            <a href="${art.html_url}" target="_blank" class="comment-btn">
              去 GitHub 发表评论
            </a>
          </div>
        `;
      });
      document.getElementById("list").innerHTML = html;

      // 加载每篇文章的评论
      data.forEach(art => {
        fetch(`https://api.github.com/repos/Eskiry/eskiry.github.io/issues/${art.number}/comments`)
        .then(res => res.json())
        .then(comments => {
          let commentHtml = "";
          if (comments.length === 0) {
            commentHtml = "<p>暂无评论，快来抢沙发！</p>";
          } else {
            comments.forEach(c => {
              commentHtml += `
                <div class="comment">
                  <div class="comment-user">${c.user.login}</div>
                  <div class="comment-content">${marked.parse(c.body)}</div>
                </div>
              `;
            });
          }
          document.getElementById(`comments-${art.number}`).innerHTML = commentHtml;
        })
      });
    })
  </script>
</body>
</html>
