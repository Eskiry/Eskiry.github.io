<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eskiry's Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #eee;
      --card-bg: #f9f9f9;
      --code-bg: #f7f7f7;
      --mask-end: #fff;
      --btn-bg: #f5f5f5;
      --btn-text: #0055cc;
      --muted: #444444;
      --sidebar-bg: #fafafa;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #f0f0f0;
      --border: #2a2a2a;
      --card-bg: #1e1e1e;
      --code-bg: #252525;
      --mask-end: #121212;
      --btn-bg: #252525;
      --btn-text: #69b1ff;
      --muted: #bbbbbb;
      --sidebar-bg: #1a1a1a;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:"Noto Serif SC",serif;
      line-height:1.9;
      font-size:17px;
      background:var(--bg);
      color:var(--text);
      transition:.3s;
      text-align:left;
    }
    .container{display:flex;min-height:100vh;max-width:1920px;margin:0 auto}
    .sidebar{
      width:260px;
      background:var(--sidebar-bg);
      padding:40px 20px;
      border-right:1px solid var(--border);
      position:sticky;
      top:0;
      height:100vh;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
    }
    .sidebar-main{flex:1;}
    .sidebar-footer{
      margin-top:auto;
      padding-top:20px;
      border-top:1px solid var(--border);
      text-align:center;
      font-size:12px;
      color:var(--muted);
      line-height:1.8;
    }
    .sidebar h2{font-size:22px;margin-bottom:25px;text-align:center}
    .category-item{padding:10px 15px;margin:6px 0;border-radius:8px;cursor:pointer;font-size:17px;transition:.2s}
    .category-item.active,.category-item:hover{background:var(--btn-bg);color:var(--btn-text)}
    .main{flex:1;padding:20px 5% 60px;text-align:left;}
    .theme-btn,.random-mini-btn{
      margin:4px;
      padding:5px 10px;
      border-radius:6px;
      border:none;
      background:var(--btn-bg);
      color:var(--btn-text);
      cursor:pointer;
      font-size:12px;
      font-family:inherit;
      display:inline-block;
    }
    .loading-tip{
      text-align:left;
      padding:60px 0;
      color:var(--muted);
      font-size:16px;
    }
    .post{
      padding:35px 0;
      border-bottom:1px solid var(--border);
      position:relative;
      text-align:left;
    }
    .post h2{
      font-size:20px;
      font-weight:600;
      margin:0 0 18px 0;
      color:var(--text);
      line-height:1.4;
      text-align:left;
    }
    .post-content{
      font-size:18px;
      position:relative;
      transition:max-height .4s;
      text-align:left;
      color:var(--text);
    }
    .post-content.collapsible{max-height:640px;overflow:hidden}
    .post-content.collapsible::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:60px;background:linear-gradient(transparent,var(--mask-end));pointer-events:none}
    .post-content.expand{max-height:3000px;overflow:visible}
    .post-content.expand::after{display:none}
    .post-content img{max-width:100%;border-radius:6px}
    .post-content pre,.post-content code{background:var(--code-bg);border-radius:4px}
    .post-content pre{padding:18px;overflow-x:auto;margin:18px 0;font-size:16px}
    .post-content code{padding:3px 6px;font-size:16px}
    .toggle-btn{
      display:none;
      margin:15px 0 0;
      padding:6px 14px;
      background:var(--btn-bg);
      border-radius:6px;
      cursor:pointer;
      color:var(--btn-text);
      border:none;
    }
    .post-content.collapsible~.toggle-btn{display:inline-block}
    .pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:40px;flex-wrap:wrap;}
    .page-btn{padding:6px 16px;border-radius:6px;border:none;background:var(--btn-bg);color:var(--btn-text);cursor:pointer}
    .page-btn:disabled{opacity:.5;cursor:not-allowed}
    .jump-input{width:50px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);text-align:center;}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-main">
        <h2>Eskiry's Blog</h2>
        <div class="category-item active" onclick="filterPosts('all')">全部文章</div>
      </div>

      <div class="sidebar-footer">
        <button class="theme-btn" id="themeBtn">日间模式</button>
        <button class="random-mini-btn" onclick="showRandomPost()">随机</button>
      </div>
    </div>

    <div class="main">
      <div id="list" class="loading-tip">正在加载文章...</div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    let allPosts = [], allLabels = [], filteredPosts = [];
    let currentPage = 1;
    const pageSize = 25, COLLAPSE_HEIGHT = 640;

    // 随机文章
    function showRandomPost() {
      if(!allPosts || allPosts.length === 0) return;
      const post = allPosts[Math.floor(Math.random() * allPosts.length)];
      filteredPosts = [post];
      currentPage = 1;
      renderPage();
    }

    // 主题初始化
    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('theme');
    if(savedTheme === 'light'){
      document.documentElement.removeAttribute('data-theme');
      themeBtn.textContent = "夜间模式";
    }else{
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = "日间模式";
    }

    themeBtn.onclick = () => {
      const dark = document.documentElement.hasAttribute('data-theme');
      if (dark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '夜间模式';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '日间模式';
      }
    };

    async function init() {
      await loadLocalPosts();
      renderCategory();
    }

    // 加载本地posts.json 纯静态无API
    async function loadLocalPosts() {
      try {
        const res = await fetch('./posts.json');
        if (!res.ok) throw new Error('读取文章配置失败');
        allPosts = await res.json();
        let tagSet = new Set();
        allPosts.forEach(p => p.labels.forEach(t => tagSet.add(t)));
        allLabels = Array.from(tagSet);

        filteredPosts = [...allPosts];
        renderPage();
      } catch (e) {
        document.getElementById('list').innerHTML = `<p style='text-align:left;margin-top:50px;color:var(--text)'>加载失败：${e.message}<br>请检查 posts.json 文件是否存在</p>`;
      }
    }

    // 渲染侧边栏分类
    function renderCategory() {
      const side = document.getElementById('sidebar').querySelector('.sidebar-main');
      allLabels.forEach(tag => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = tag;
        div.onclick = () => filterPosts(tag);
        side.appendChild(div);
      });
    }

    // 分类筛选
    function filterPosts(tag) {
      document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
      event.target.classList.add('active');
      currentPage = 1;
      filteredPosts = tag === 'all' ? [...allPosts] : allPosts.filter(p => p.labels.includes(tag));
      renderPage();
    }

    function renderPage() {
      const total = Math.ceil(filteredPosts.length / pageSize);
      const start = (currentPage - 1) * pageSize;
      renderPosts(filteredPosts.slice(start, start + pageSize));
      renderPagination(total);
    }

    function renderPosts(posts) {
      if (!posts.length) {
        document.getElementById('list').innerHTML = "<p style='text-align:left;margin-top:50px;color:var(--text)'>该分类下暂无文章</p>";
        return;
      }
      let html = '';
      posts.forEach((art, idx) => {
        const id = idx + 1;
        html += `
          <div class="post">
            <h2>${art.title}</h2>
            <div class="post-content" id="b${id}">${marked.parse(art.body)}</div>
            <button class="toggle-btn" id="tb${id}" onclick="toggleBody(${id})">阅读全文</button>
          </div>`;
      });
      document.getElementById('list').innerHTML = html;
      posts.forEach((_, idx) => { 
        const id = idx + 1;
        setTimeout(()=>checkCollapse(id),0) 
      });
    }

    function toggleBody(id) {
      const el = document.getElementById(`b${id}`);
      const btn = document.getElementById(`tb${id}`);
      el.classList.toggle("expand");
      if(el.classList.contains("expand")){
        btn.textContent = "收起";
        el.classList.remove("collapsible");
      }else{
        btn.textContent = "阅读全文";
        setTimeout(()=>checkCollapse(id),0);
      }
    }

    function checkCollapse(id) {
      const el = document.getElementById(`b${id}`);
      el.style.maxHeight = 'none';
      if (el.scrollHeight > COLLAPSE_HEIGHT) {
        el.classList.add("collapsible");
      } else {
        el.classList.remove("collapsible");
      }
      el.style.maxHeight = '';
    }

    // 跳转到指定页
    function jumpToPage() {
      const total = Math.ceil(filteredPosts.length / pageSize);
      const input = document.getElementById('jumpInput');
      let page = parseInt(input.value.trim());
      
      if (isNaN(page)) return;
      page = Math.max(1, Math.min(page, total));
      currentPage = page;
      renderPage();
      scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPagination(total) {
      const wrap = document.getElementById('pagination');
      if (total <= 1) {
        wrap.innerHTML = '';
        return;
      }
      
      wrap.innerHTML = `
        <button class="page-btn" onclick="prev()" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
        <span>${currentPage}/${total}</span>
        <button class="page-btn" onclick="next()" ${currentPage === total ? 'disabled' : ''}>下一页</button>
        <input type="number" class="jump-input" id="jumpInput" min="1" max="${total}" placeholder="页码" />
        <button class="page-btn" onclick="jumpToPage()">跳转</button>
      `;
      // 输入框回车跳转
      document.getElementById('jumpInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') jumpToPage();
      });
    }

    function prev() { currentPage--; renderPage(); scrollTo({top:0,behavior:'smooth'}) }
    function next() { currentPage++; renderPage(); scrollTo({top:0,behavior:'smooth'}) }
    init();
  </script>
</body>
</html>
