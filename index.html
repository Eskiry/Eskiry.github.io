<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog From Eskiry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff;
      --text: #333;
      --border: #eee;
      --card-bg: #f9f9f9;
      --code-bg: #f6f8fa;
      --mask-end: #fff;
      --btn-bg: #f1f1f1;
      --btn-text: #0969da;
      --muted: #888;
      --sidebar-bg: #fafafa;
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #e5e5e5;
      --border: #2a2a2a;
      --card-bg: #1e1e1e;
      --code-bg: #2b2b2b;
      --mask-end: #121212;
      --btn-bg: #2a2a2a;
      --btn-text: #58a6ff;
      --muted: #777;
      --sidebar-bg: #1a1a1a;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Noto Serif SC",serif;line-height:1.9;font-size:17px;background:var(--bg);color:var(--text);transition:.3s}
    .container{display:flex;min-height:100vh;max-width:1920px;margin:0 auto}
    .sidebar{width:260px;background:var(--sidebar-bg);padding:40px 20px;border-right:1px solid var(--border);position:sticky;top:0;height:100vh;overflow-y:auto}
    .sidebar h2{font-size:22px;margin-bottom:25px;text-align:center}
    .category-item{padding:10px 15px;margin:6px 0;border-radius:8px;cursor:pointer;font-size:18px;transition:.2s}
    .category-item.active,.category-item:hover{background:var(--btn-bg);color:var(--btn-text)}
    .main{flex:1;padding:40px 5% 60px}
    .theme-btn{position:fixed;top:20px;right:5%;padding:6px 12px;border-radius:6px;border:none;background:var(--btn-bg);color:var(--btn-text);cursor:pointer;font-size:14px;z-index:99}
    h1{text-align:center;margin-bottom:50px;font-weight:600;font-size:32px}
    .post{padding:35px 0;border-bottom:1px solid var(--border);position:relative}
    .post-meta{display:none;}
    .post-action-bar{position:absolute;right:0;bottom:10px;display:flex;gap:8px;align-items:center}
    .data-box{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;background:var(--btn-bg);border-radius:4px;color:var(--muted);font-size:12px}
    .like-box,.cmt-btn{cursor:pointer}
    .like-box:hover,.cmt-btn:hover{color:var(--btn-text)}
    .post h2{display:none;font-size:16px;margin:12px 0;opacity:.85}
    .post-content.expand~h2{display:block}
    .post-content{font-size:18px;position:relative;transition:max-height .4s}
    .post-content.collapsible{max-height:640px;overflow:hidden}
    .post-content.collapsible::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:60px;background:linear-gradient(transparent,var(--mask-end));pointer-events:none}
    .post-content.expand{max-height:3000px;overflow:visible}
    .post-content.expand::after{display:none}
    .post-content img{max-width:100%;border-radius:6px}
    .post-content pre,.post-content code{background:var(--code-bg);border-radius:4px}
    .post-content pre{padding:18px;overflow-x:auto;margin:18px 0;font-size:16px}
    .post-content code{padding:3px 6px;font-size:16px}
    .toggle-btn{display:none;margin:15px 0 0;padding:6px 14px;background:var(--btn-bg);border-radius:6px;cursor:pointer;color:var(--btn-text);border:none}
    .post-content.collapsible~.toggle-btn{display:inline-block}
    .comments{display:none;padding:12px;background:var(--card-bg);border-radius:8px;margin-top:16px;font-size:13px}
    .comments.open{display:block}
    .comment{padding:8px 0;border-bottom:1px solid var(--border);line-height:1.6}
    .comment:last-child{border-bottom:none}
    .comment-user{font-weight:bold;color:var(--btn-text);font-size:14px}
    .jump-comment{display:inline-block;margin-top:8px;font-size:12px;color:var(--btn-text);text-decoration:none}
    .pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:40px}
    .page-btn{padding:6px 16px;border-radius:6px;border:none;background:var(--btn-bg);color:var(--btn-text);cursor:pointer}
    .page-btn:disabled{opacity:.5;cursor:not-allowed}
    .footer-info{
      text-align:center;
      font-size:12px;
      color:var(--muted);
      margin-top:40px;
      user-select:none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <button class="theme-btn" id="themeBtn">日间模式</button>
  <div class="container">
    <div class="sidebar" id="sidebar">
      <h2>文章分类</h2>
      <div class="category-item active" onclick="filterPosts('all')">全部文章</div>
    </div>
    <div class="main">
      <h1>Blog From Eskiry</h1>
      <div id="list"></div>
      <div class="pagination" id="pagination"></div>
      
      <div class="footer-info">
        最新更新：<span id="lastUpdate">加载中...</span>
        &nbsp;&nbsp;全站访问：<span id="site_pv">0</span> 次
        &nbsp;&nbsp;访客数：<span id="site_uv">0</span> 人
      </div>
    </div>
  </div>

  <script>
    let allPosts = [], allLabels = [], filteredPosts = [];
    let currentPage = 1;
    const pageSize = 25, COLLAPSE_HEIGHT = 640, USER = "Eskiry";

    // 本地统计
    function initStats() {
      let pv = +localStorage.getItem('pv') + 1 || 1;
      localStorage.setItem('pv', pv);
      document.getElementById('site_pv').textContent = pv;

      let uv = localStorage.getItem('uv');
      if (!uv) { uv = 1; localStorage.setItem('uv', 1); }
      document.getElementById('site_uv').textContent = uv;
    }

    // 主题切换
    const themeBtn = document.getElementById('themeBtn');
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('theme', 'dark');
    themeBtn.textContent = "日间模式";

    themeBtn.onclick = () => {
      const dark = document.documentElement.hasAttribute('data-theme');
      if (dark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '夜间模式';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '日间模式';
      }
    };

    async function init() {
      await loadLabels();
      await loadPosts();
      showLastUpdate();
      initStats();
    }

    // 显示最新更新时间
    function showLastUpdate() {
      if (!allPosts.length) return;
      const latest = allPosts.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))[0];
      const time = new Date(latest.updated_at).toLocaleDateString('zh-CN', {
        year: 'numeric', month: '2-digit', day: '2-digit'
      });
      document.getElementById('lastUpdate').textContent = time;
    }

    async function loadLabels() {
      const res = await fetch(`https://api.github.com/repos/${USER}/${USER}.github.io/labels`);
      allLabels = await res.json();
      const side = document.getElementById('sidebar');
      allLabels.forEach(l => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = l.name;
        div.onclick = () => filterPosts(l.name);
        side.appendChild(div);
      });
    }

    async function loadPosts() {
      const res = await fetch(`https://api.github.com/repos/${USER}/${USER}.github.io/issues?per_page=100`);
      const data = await res.json();
      allPosts = data.filter(p => p.user.login === USER);
      filteredPosts = [...allPosts];
      renderPage();
    }

    function filterPosts(tag) {
      document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
      event.target.classList.add('active');
      currentPage = 1;
      filteredPosts = tag === 'all' ? [...allPosts] : allPosts.filter(p => p.labels.some(l => l.name === tag));
      renderPage();
    }

    function renderPage() {
      const total = Math.ceil(filteredPosts.length / pageSize);
      const start = (currentPage - 1) * pageSize;
      renderPosts(filteredPosts.slice(start, start + pageSize));
      renderPagination(total);
    }

    function renderPosts(posts) {
      if (!posts.length) {
        document.getElementById('list').innerHTML = "<p style='text-align:center;margin-top:50px;'>该分类下暂无文章</p>";
        return;
      }
      let html = '';
      posts.forEach(art => {
        html += `
          <div class="post">
            <div class="post-meta"></div>
            <div class="post-content" id="b${art.number}">${marked.parse(art.body)}</div>
            <div class="post-action-bar">
              <div class="data-box like-box" onclick="window.open('${art.html_url}','_blank')">👍 <span id="l${art.number}">0</span></div>
              <button class="data-box cmt-btn" onclick="toggleCmt(${art.number})">💬 <span id="c${art.number}">0</span></button>
            </div>
            <h2>${art.title}</h2>
            <button class="toggle-btn" onclick="toggleBody(${art.number})">阅读全文</button>
            <div class="comments" id="cmt${art.number}">
              <p>加载评论中...</p>
              <a href="${art.html_url}" target="_blank" class="jump-comment">去 GitHub 评论 →</a>
            </div>
          </div>`;
      });
      document.getElementById('list').innerHTML = html;
      posts.forEach(art => { loadReactions(art.number); loadComments(art.number); setTimeout(()=>checkCollapse(art.number),0) });
    }

    function toggleCmt(id) { document.getElementById(`cmt${id}`).classList.toggle("open") }
    function toggleBody(id) {
      const el = document.getElementById(`b${id}`), btn = el.nextElementSibling.nextElementSibling.nextElementSibling;
      el.classList.toggle("expand");
      if (el.classList.contains("expand")) { el.classList.remove("collapsible"); btn.textContent = "收起"; }
      else { setTimeout(()=>checkCollapse(id),0); btn.textContent = "阅读全文"; }
    }

    async function loadReactions(id) {
      try {
        const r = await fetch(`https://api.github.com/repos/${USER}/${USER}.github.io/issues/${id}/reactions`);
        const data = await r.json();
        document.getElementById(`l${id}`).textContent = data.filter(x=>x.content==="+1").length;
      } catch(e) { document.getElementById(`l${id}`).textContent = "0" }
    }

    async function loadComments(id) {
      const r = await fetch(`https://api.github.com/repos/${USER}/${USER}.github.io/issues/${id}/comments`);
      const list = await r.json();
      document.getElementById(`c${id}`).textContent = list.length;
      let html = list.length ? '' : '<p>暂无评论</p>';
      list.forEach(c => { html += `<div class="comment"><div class="comment-user">${c.user.login}</div><div class="comment-content">${marked.parse(c.body)}</div></div>` });
      html += `<a href="https://github.com/${USER}/${USER}.github.io/issues/${id}" target="_blank" class="jump-comment">去 GitHub 评论 →</a>`;
      document.getElementById(`cmt${id}`).innerHTML = html;
    }

    function checkCollapse(id) {
      const el = document.getElementById(`b${id}`);
      el.style.maxHeight = 'none';
      if (el.scrollHeight > COLLAPSE_HEIGHT) el.classList.add("collapsible");
      el.style.maxHeight = '';
    }

    function renderPagination(total) {
      const wrap = document.getElementById('pagination');
      if (total <= 1) { wrap.innerHTML = ''; return; }
      wrap.innerHTML = `
        <button class="page-btn" onclick="prev()" ${currentPage===1?'disabled':''}>上一页</button>
        <span>${currentPage}/${total}</span>
        <button class="page-btn" onclick="next()" ${currentPage===total?'disabled':''}>下一页</button>`;
    }

    function prev() { currentPage--; renderPage(); scrollTo({top:0,behavior:'smooth'}) }
    function next() { currentPage++; renderPage(); scrollTo({top:0,behavior:'smooth'}) }
    init();
  </script>
</body>
</html>
