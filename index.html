<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blog From Eskiry</title>
<style>
body{max-width:800px;margin:0 auto;padding:20px;font-family:"Noto Sans SC",sans-serif;}
.post{border-bottom:1px solid #eee;padding:20px 0;}
.post h2{margin:0 0 10px 0;}
.post p{line-height:1.8;}
</style>
</head>
<body>
<h1>Blog From Eskiry</h1>
<p>日常</p>

<!-- 下面不用改，以后你发的所有Issue文章都会自动全部显示正文 -->
<script>
fetch("https://api.github.com/repos/Eskiry/eskiry.github.io/issues?state=all&per_page=100")
.then(res=>res.json())
.then(list=>{
  list.forEach(issue=>{
    let div=document.createElement("div");
    div.className="post";
    div.innerHTML=`
      <h2>${issue.title}</h2>
      <div>${issue.body}</div>
    `;
    document.body.appendChild(div);
  })
})
</script>
</body>
</html>
