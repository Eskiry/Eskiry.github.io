<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog From Eskiry</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #333333;
      --border: #eee;
      --card-bg: #f9f9f9;
      --code-bg: #f6f8fa;
      --mask-start: transparent;
      --mask-end: #fff;
      --btn-bg: #f1f1f1;
      --btn-text: #0969da;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --text: #e5e5e5;
      --border: #2a2a2a;
      --card-bg: #1e1e1e;
      --code-bg: #2b2b2b;
      --mask-start: transparent;
      --mask-end: #121212;
      --btn-bg: #2a2a2a;
      --btn-text: #58a6ff;
    }

    * {margin: 0; padding: 0; box-sizing: border-box;}
    body {
      /* 版面全屏自适应，不再固定窄宽度 */
      max-width: 100%;
      margin: 0 auto;
      padding: 40px 5%;
      /* 开源衬线字体 */
      font-family: "Noto Serif SC", serif;
      line-height: 1.9;
      /* 全局字体加大 */
      font-size: 17px;
      background-color: var(--bg);
      color: var(--text);
      transition: background 0.3s ease, color 0.3s ease;
    }

    .theme-btn {
      position: fixed;
      top: 20px;
      right: 5%;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
    }

    h1 {
      text-align: center;
      margin-bottom: 50px;
      font-weight: 600;
      font-size: 32px;
    }
    .post {
      padding: 35px 0;
      border-bottom: 1px solid var(--border);
    }
    .post h2 {
      font-size: 26px;
      margin-bottom: 18px;
      color: inherit;
    }

    /* 折叠高度保持320px */
    .post-content {
      font-size: 18px;
      max-height: 320px;
      overflow: hidden;
      position: relative;
      transition: max-height 0.4s ease;
    }
    .post-content.expand {
      max-height: 3000px;
    }
    .post-content::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(to bottom, var(--mask-start), var(--mask-end));
      pointer-events: none;
    }
    .post-content.expand::after {
      display: none;
    }

    .post-content img {max-width: 100%; border-radius: 6px;}
    .post-content pre {
      background: var(--code-bg);
      padding: 18px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 18px 0;
      font-size: 16px;
    }
    .post-content code {
      background: var(--code-bg);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 16px;
    }

    .toggle-btn {
      display: inline-block;
      margin: 15px 12px 22px 0;
      padding: 8px 18px;
      background: var(--btn-bg);
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      color: var(--btn-text);
      border: none;
      font-family: inherit;
    }
    .toggle-btn:hover {
      opacity: 0.9;
    }

    .comments {
      padding: 20px;
      background: var(--card-bg);
      border-radius: 10px;
      margin-top: 12px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }
    .comments.expand {
      max-height: 2000px;
    }
    .comment {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 17px;
    }
    .comment:last-child {
      border-bottom: none;
    }
    .comment-user {
      font-weight: bold;
      color: var(--btn-text);
      font-size: 18px;
    }
    .comment-content {
      margin-top: 6px;
      font-size: 17px;
    }
    .jump-comment {
      display: inline-block;
      margin-top: 12px;
      font-size: 16px;
      color: var(--btn-text);
      text-decoration: none;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <button class="theme-btn" id="themeBtn">夜间模式</button>

  <h1>Blog From Eskiry</h1>
  <div id="list"></div>

  <script>
    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('blog-theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.innerText = "日间模式";
    }

    themeBtn.addEventListener('click', () => {
      const isDark = document.documentElement.hasAttribute('data-theme');
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('blog-theme', 'light');
        themeBtn.innerText = '夜间模式';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('blog-theme', 'dark');
        themeBtn.innerText = '日间模式';
      }
    });

    fetch("https://api.github.com/repos/Eskiry/eskiry.github.io/issues?per_page=100")
    .then(res => res.json())
    .then(data => {
      let html = "";
      data.forEach(art => {
        html += `
          <div class="post">
            <h2>${art.title}</h2>
            <div class="post-content" id="body-${art.number}">
              ${marked.parse(art.body)}
            </div>
            <button class="toggle-btn" onclick="toggleBody(${art.number})">阅读全文</button>
            <button class="toggle-btn" onclick="toggleComment(${art.number})">展开评论</button>
            <div class="comments" id="cmt-${art.number}">
              <p>加载评论中...</p>
              <a href="${art.html_url}" target="_blank" class="jump-comment">去 GitHub 发表评论 →</a>
            </div>
          </div>
        `;
      });
      document.getElementById("list").innerHTML = html;

      data.forEach(art => {
        fetch(`https://api.github.com/repos/Eskiry/eskiry.github.io/issues/${art.number}/comments`)
        .then(res => res.json())
        .then(comments => {
          let ch = "";
          if (comments.length === 0) {
            ch = "<p>暂无评论</p>";
          } else {
            comments.forEach(c => {
              ch += `
                <div class="comment">
                  <div class="comment-user">${c.user.login}</div>
                  <div class="comment-content">${marked.parse(c.body)}</div>
                </div>
              `;
            });
          }
          ch += `<a href="${art.html_url}" target="_blank" class="jump-comment">去 GitHub 发表评论 →</a>`;
          document.getElementById(`cmt-${art.number}`).innerHTML = ch;
        })
      });
    })

    function toggleBody(id){
      const el = document.getElementById(`body-${id}`);
      const btn = el.nextElementSibling;
      el.classList.toggle("expand");
      btn.innerText = el.classList.contains("expand") ? "收起" : "阅读全文";
    }

    function toggleComment(id){
      const el = document.getElementById(`cmt-${id}`);
      const btn = el.previousElementSibling;
      el.classList.toggle("expand");
      btn.innerText = el.classList.contains("expand") ? "收起评论" : "展开评论";
    }
  </script>
</body>
</html>
