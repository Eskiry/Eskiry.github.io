<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Eskiry's Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff;
      --text: #000000;        /* 超高对比 纯黑 */
      --border: #eee;
      --card-bg: #f9f9f9;
      --code-bg: #f7f7f7;
      --mask-end: #fff;
      --btn-bg: #f5f5f5;
      --btn-text: #0969da;
      --muted: #555;
      --sidebar-bg: #fafafa;
      --action-bg: rgba(240,240,240,0.4);
    }
    [data-theme="dark"] {
      --bg: #121212;
      --text: #ffffff;        /* 超高对比 纯白 */
      --border: #2a2a2a;
      --card-bg: #1e1e1e;
      --code-bg: #252525;
      --mask-end: #121212;
      --btn-bg: #252525;
      --btn-text: #58a6ff;
      --muted: #ccc;
      --sidebar-bg: #1a1a1a;
      --action-bg: rgba(40,40,40,0.35);
    }
    *{margin:0;padding:0;box-sizing:border-box;text-align:left;}
    body{font-family:"Noto Serif SC",serif;line-height:1.9;font-size:17px;background:var(--bg);color:var(--text);transition:.3s}
    .container{display:flex;min-height:100vh;max-width:1920px;margin:0 auto}
    .sidebar{
      width:260px;
      background:var(--sidebar-bg);
      padding:40px 20px;
      border-right:1px solid var(--border);
      position:sticky;
      top:0;
      height:100vh;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      align-items: center;
    }
    .sidebar-main{
      flex:1;
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .sidebar-footer{
      margin-top:auto;
      padding-top:20px;
      border-top:1px solid var(--border);
      font-size:12px;
      color:var(--muted);
      line-height:1.8;
      text-align:center;
      width:100%;
    }
    .sidebar h2{
      font-size:22px;
      margin-bottom:25px;
      text-align:center;
    }
    .category-item{
      width:100%;
      max-width:220px;
      padding:10px 15px;
      margin:6px 0;
      border-radius:8px;
      cursor:pointer;
      font-size:17px;
      transition:.2s;
      text-align:center;
    }
    .category-item.active,.category-item:hover{background:var(--btn-bg);color:var(--btn-text)}
    .main{flex:1;padding:20px 5% 60px}
    .theme-btn,.random-mini-btn{
      margin:4px;
      padding:5px 10px;
      border-radius:6px;
      border:none;
      background:var(--btn-bg);
      color:var(--btn-text);
      cursor:pointer;
      font-size:12px;
    }
    .loading-tip{padding:60px 0;color:var(--muted);font-size:16px}
    .post{padding:35px 0;border-bottom:1px solid var(--border);position:relative}
    .post h2{
      font-size:19px;
      font-weight:600;
      margin:0 0 18px 0;
      line-height:1.4;
    }
    .post-action-bar{
      position:absolute;
      right:0;
      bottom:10px;
      display:flex;
      gap:6px;
    }
    .cmt-btn{
      display:inline-flex;
      align-items:center;
      gap:3px;
      padding:2px 7px;
      background:var(--action-bg);
      border-radius:4px;
      color:var(--muted);
      font-size:12px;
      border:none;
      cursor:pointer;
    }
    .cmt-btn:hover{color:var(--btn-text)}
    .post-content{font-size:18px;position:relative;transition:max-height .4s}
    .post-content.collapsible{max-height:640px;overflow:hidden}
    .post-content.collapsible::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:60px;background:linear-gradient(transparent,var(--mask-end));pointer-events:none}
    .post-content.expand{max-height:3000px;overflow:visible}
    .post-content.expand::after{display:none}
    .post-content img{max-width:100%;border-radius:6px}
    .post-content pre,.post-content code{background:var(--code-bg);border-radius:4px}
    .post-content pre{padding:18px;overflow-x:auto;margin:18px 0;font-size:16px}
    .post-content code{padding:3px 6px;font-size:16px}
    .toggle-btn{display:none;margin:15px 0 0;padding:6px 14px;background:var(--btn-bg);border-radius:6px;cursor:pointer;color:var(--btn-text);border:none}
    .post-content.collapsible~.toggle-btn{display:inline-block}
    .comments{display:none;padding:12px;background:var(--card-bg);border-radius:8px;margin-top:16px;font-size:13px}
    .comments.open{display:block}
    .comment{padding:8px 0;border-bottom:1px solid var(--border);line-height:1.6}
    .comment:last-child{border-bottom:none}
    .comment-user{font-weight:bold;color:var(--btn-text);font-size:14px}
    .jump-comment{display:inline-block;margin-top:8px;font-size:12px;color:var(--btn-text)}
    .pagination{display:flex;align-items:center;gap:12px;margin-top:40px}
    .page-btn{padding:6px 16px;border-radius:6px;border:none;background:var(--btn-bg);color:var(--btn-text);cursor:pointer}
    .page-btn:disabled{opacity:.5;cursor:not-allowed}
    @media (max-width:768px){
      .container{flex-direction:column}
      .sidebar{width:100%;height:auto;border-right:none;border-bottom:1px solid var(--border);position:relative;padding:20px 15px;align-items:center}
      .category-item{font-size:18px;padding:12px 15px;max-width:100%}
      .sidebar-footer{margin-top:20px;padding-top:15px;text-align:center}
      .main{padding:15px 4% 40px}
      .post{padding:25px 0}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <div class="container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-main">
        <h2>Eskiry's Blog</h2>
        <div class="category-item active" onclick="filterPosts('all')">全部文章</div>
      </div>

      <div class="sidebar-footer">
        <button class="theme-btn" id="themeBtn">日间模式</button>
        <button class="random-mini-btn" onclick="showRandomPost()">随机</button>
        <div>最新更新：<span id="lastUpdate">加载中...</span></div>
        <div>访问：<span id="site_pv">0</span> 次 · 访客：<span id="site_uv">0</span> 人</div>
      </div>
    </div>

    <div class="main">
      <div id="list" class="loading-tip">正在加载文章...</div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    let allPosts = [], allLabels = [], filteredPosts = [];
    let currentPage = 1;
    const pageSize = 25, COLLAPSE_HEIGHT = 640, USER = "Eskiry";

    // 随机文章
    function showRandomPost() {
      if(!allPosts || allPosts.length === 0) return;
      const post = allPosts[Math.floor(Math.random() * allPosts.length)];
      filteredPosts = [post];
      currentPage = 1;
      renderPage();
    }

    // 本地访客统计（永久保存）
    function initStats() {
      let pv = +localStorage.getItem('pv') + 1 || 1;
      localStorage.setItem('pv', pv);
      document.getElementById('site_pv').textContent = pv;

      let hasVisit = localStorage.getItem('has_visit');
      let uv = +localStorage.getItem('uv') || 0;
      if (!hasVisit) {
        uv++;
        localStorage.setItem('uv', uv);
        localStorage.setItem('has_visit', 'true');
      }
      document.getElementById('site_uv').textContent = uv;
    }

    // 主题切换
    const themeBtn = document.getElementById('themeBtn');
    const savedTheme = localStorage.getItem('theme');
    if(savedTheme === 'light'){
      document.documentElement.removeAttribute('data-theme');
      themeBtn.textContent = "夜间模式";
    }else{
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = "日间模式";
    }
    themeBtn.onclick = () => {
      const dark = document.documentElement.hasAttribute('data-theme');
      if (dark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
        themeBtn.textContent = '夜间模式';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
        themeBtn.textContent = '日间模式';
      }
    };

    // 初始化
    async function init() {
      await loadLabels();
      await loadPosts();
      showLastUpdate();
      initStats();
    }

    // 最新更新时间
    function showLastUpdate() {
      if (!allPosts.length) return;
      const latest = allPosts.sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at))[0];
      const time = new Date(latest.updated_at).toLocaleDateString('zh-CN');
      document.getElementById('lastUpdate').textContent = time;
    }

    // 加载标签
    async function loadLabels() {
      const res = await fetch(`https://api.github.com/repos/${USER}/${USER}.github.io/labels`);
      allLabels = await res.json();
      const side = document.getElementById('sidebar');
      allLabels.forEach(l => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = l.name;
        div.onclick = () => filterPosts(l.name);
        side.querySelector('.sidebar-main').appendChild(div);
      });
    }

    // 加载所有文章（你原来能用的版本）
    async function loadPosts() {
      const res = await fetch(`https://api.github.com/repos/${USER}/${USER}.github.io/issues?per_page=100`);
      const data = await res.json();
      allPosts = data.filter(p => p.user.login === USER);
      filteredPosts = [...allPosts];
      renderPage();
    }

    // 分类筛选
    function filterPosts(tag) {
      document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
      event.target.classList.add('active');
      currentPage = 1;
      filteredPosts = tag === 'all' ? [...allPosts] : allPosts.filter(p => p.labels.some(l => l.name === tag));
      renderPage();
    }

    // 渲染分页
    function renderPage() {
      const total = Math.ceil(filteredPosts.length / pageSize);
      const start = (currentPage - 1) * pageSize;
      renderPosts(filteredPosts.slice(start, start + pageSize));
      renderPagination(total);
    }

    // 渲染文章（已删除点赞）
    function renderPosts(posts) {
      if (!posts.length) {
        document.getElementById('list').innerHTML = "<p>该分类下暂无文章</p>";
        return;
      }
      let html = '';
      posts.forEach(art => {
        html += `
          <div class="post">
            <h2>${art.title}</h2>
            <div class="post-content" id="b${art.number}">${marked.parse(art.body)}</div>
            <div class="post-action-bar">
              <div class="cmt-btn" onclick="toggleCmt(${art.number})">◇ <span id="c${art.number}">0</span></div>
            </div>
            <button class="toggle-btn" id="tb${art.number}" onclick="toggleBody(${art.number})">阅读全文</button>
            <div class="comments" id="cmt${art.number}">
              <p>加载评论中...</p>
              <a href="${art.html_url}" target="_blank">去 GitHub 评论 →</a>
            </div>
          </div>`;
      });
      document.getElementById('list').innerHTML = html;
      posts.forEach(art => { 
        loadComments(art.number); 
        setTimeout(()=>checkCollapse(art.number),0) 
      });
    }

    function toggleCmt(id) { document.getElementById(`cmt${id}`).classList.toggle("open") }
    function toggleBody(id) {
      const el = document.getElementById(`b${id}`);
      const btn = document.getElementById(`tb${id}`);
      el.classList.toggle("expand");
      el.classList.contains("expand") ? btn.textContent = "收起" : btn.textContent = "阅读全文";
    }

    // 加载评论
    async function loadComments(id) {
      const r = await fetch(`https://api.github.com/repos/${USER}/${USER}.github.io/issues/${id}/comments`);
      const list = await r.json();
      document.getElementById(`c${id}`).textContent = list.length;
      let html = list.length ? '' : '<p>暂无评论</p>';
      list.forEach(c => { html += `<div class="comment"><div class="comment-user">${c.user.login}</div><div>${marked.parse(c.body)}</div></div>` });
      html += `<a href="https://github.com/${USER}/${USER}.github.io/issues/${id}" target="_blank">去 GitHub 评论 →</a>`;
      document.getElementById(`cmt${id}`).innerHTML = html;
    }

    // 自动折叠
    function checkCollapse(id) {
      const el = document.getElementById(`b${id}`);
      el.style.maxHeight = 'none';
      el.scrollHeight > COLLAPSE_HEIGHT ? el.classList.add("collapsible") : el.classList.remove("collapsible");
      el.style.maxHeight = '';
    }

    // 分页按钮
    function renderPagination(total) {
      const wrap = document.getElementById('pagination');
      total <= 1 ? wrap.innerHTML = '' : wrap.innerHTML = `
        <button class="page-btn" onclick="prev()" ${currentPage===1?'disabled':''}>上一页</button>
        <span>${currentPage}/${total}</span>
        <button class="page-btn" onclick="next()" ${currentPage===total?'disabled':''}>下一页</button>`;
    }
    function prev() { currentPage--; renderPage(); scrollTo({top:0,behavior:'smooth'}) }
    function next() { currentPage++; renderPage(); scrollTo({top:0,behavior:'smooth'}) }

    init();
  </script>
</body>
</html>
