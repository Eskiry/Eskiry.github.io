<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>layi's record</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* CSS 样式完全保持原样，未做任何改动 */
    :root {
      --bg: #fbf7ec;
      --text: #2c2c2c;
      --border: #e6dec5;
      --card-bg: #f4efdf;
      --code-bg: #eee7d3;
      --mask-end: #fbf7ec;
      --btn-bg: #f0e8d0;
      --btn-text: #8c5822;
      --muted: #6b6353;
      --sidebar-bg: #f6efe2;
    }
    
    [data-theme="dark"] {
      --bg: #161618;
      --text: #e1e1e6;
      --border: #2a2a2e;
      --card-bg: #1e1e22;
      --code-bg: #26262b;
      --mask-end: #161618;
      --btn-bg: #26262b;
      --btn-text: #528bff;
      --muted: #9c9ca6;
      --sidebar-bg: #1a1a1e;
    }

    [data-theme="eink"] {
      --bg: #ffffff;
      --text: #000000;
      --border: #000000;
      --card-bg: #ffffff;
      --code-bg: #f0f0f0;
      --mask-end: #fff;
      --btn-bg: #ffffff;
      --btn-text: #000000;
      --muted: #000000;
      --sidebar-bg: #ffffff;
    }

    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:"Noto Serif SC",serif;
      line-height:1.9;
      font-size:17px;
      background:var(--bg);
      color:var(--text);
      transition: background .3s, color .3s;
      text-align:left;
    }
    .container{display:flex;min-height:100vh;max-width:1920px;margin:0 auto}

    .sidebar{
      width:220px;
      background:var(--sidebar-bg);
      padding:40px 15px;
      border-right:1px solid var(--border);
      position:sticky;
      top:0;
      height:100vh;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
      text-align:center;
      transition: transform 0.3s ease;
      z-index: 99;
    }
    .sidebar-main{flex:1;}
    .sidebar-footer{
      margin-top:auto;
      padding-top:20px;
      border-top:1px solid var(--border);
      text-align:center;
      font-size:12px;
      color:var(--muted);
      line-height:1.8;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sidebar h2{font-size:22px;margin-bottom:20px;text-align:center}

    .category-item{
      padding:10px 12px;
      margin:6px auto;
      border-radius:8px;
      cursor:pointer;
      font-size:17px;
      transition:.2s;
      width: 90%;
    }
    .category-item.active,.category-item:hover{
      background: var(--btn-bg);
      color: var(--btn-text);
      font-weight: 600;
    }
    [data-theme="eink"] .category-item.active, 
    [data-theme="eink"] .category-item:hover {
      background: #000000;
      color: #ffffff;
    }

    .main{flex:1;padding:20px 5% 60px;text-align:left;transition: margin-left 0.3s;}

    .theme-btn,.random-mini-btn{
      padding:6px 10px;
      border-radius:6px;
      border: 1px solid var(--border);
      background:var(--btn-bg);
      color:var(--btn-text);
      cursor:pointer;
      font-size:12px;
      font-family:inherit;
    }
    
    [data-theme="eink"] .theme-btn, 
    [data-theme="eink"] .random-mini-btn,
    [data-theme="eink"] .search-input,
    [data-theme="eink"] .page-btn,
    [data-theme="eink"] .jump-input {
      border: 1px solid #000000 !important;
    }

    .search-input{
      padding:5px 10px;
      border-radius:6px;
      border:1px solid var(--border);
      background:var(--btn-bg);
      color:var(--text);
      font-size:12px;
      font-family:inherit;
      outline: none;
      width: 100%;
      margin: 0 auto;
    }
    .search-input:focus{
      border-color: var(--btn-text);
    }

    .sidebar-toggle{
      position: fixed;
      top: 15px;
      left: 15px;
      z-index: 100;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--btn-text);
      cursor: pointer;
      font-size: 14px;
      display: none;
    }

    .post{
      padding:35px 0;
      border-bottom:1px solid var(--border);
      position:relative;
      text-align:left;
    }
    .post h2{
      font-size:20px;
      font-weight:600;
      margin:0 0 18px 0;
      color:var(--text);
      line-height:1.4;
      text-align:left;
    }
    
    .thought-meta {
      text-align: right;
      font-size: 14px;
      color: var(--muted);
      margin-top: 12px;
      font-style: italic;
    }

    .post-content{
      font-size:18px;
      position:relative;
      transition:max-height .4s;
      text-align:left;
      color:var(--text);
    }
    .post-content.collapsible{max-height:640px;overflow:hidden}
    .post-content.collapsible::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:60px;background:linear-gradient(transparent,var(--mask-end));pointer-events:none}
    
    [data-theme="eink"] .post-content.collapsible::after {
      background: none;
      border-bottom: 2px dashed #000;
    }

    .post-content.expand{max-height:3000px;overflow:visible}
    .post-content.expand::after{display:none}
    .post-content img{max-width:100%;border-radius:6px}
    .post-content pre,.post-content code{background:var(--code-bg);border-radius:4px}
    .post-content pre{padding:18px;overflow-x:auto;margin:18px 0;font-size:16px}
    .post-content code{padding:3px 6px;font-size:16px}
    .toggle-btn{
      display:none;
      margin:15px 0 0;
      padding:6px 14px;
      background:var(--btn-bg);
      border-radius:6px;
      cursor:pointer;
      color:var(--btn-text);
      border: 1px solid var(--border);
    }
    .post-content.collapsible~.toggle-btn{display:inline-block}
    .pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:40px;flex-wrap:wrap;}
    .page-btn{padding:6px 16px;border-radius:6px;border:1px solid var(--border);background:var(--btn-bg);color:var(--btn-text);cursor:pointer}
    .page-btn:disabled{opacity:.5;cursor:not-allowed}
    .jump-input{width:50px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);text-align:center;}

    #fallbackBox {
      padding: 25px;
      border: 2px dashed var(--btn-text);
      border-radius: 8px;
      background: var(--card-bg);
      margin-bottom: 20px;
    }
    .fallback-file-item {
      padding: 12px;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
    }

    @media (max-width: 768px) {
      .sidebar-toggle{display: block;}
      .container {flex-direction: column;}
      .sidebar {
        width: 200px;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        border-right: 1px solid var(--border);
        border-bottom: none;
      }
      .sidebar.show {
        transform: translateX(0);
      }
      .main {
        padding: 20px 15px 40px;
      }
      .post {padding: 25px 0;}
      .post h2 {font-size: 18px;}
      .post-content {font-size: 16px;}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <button class="sidebar-toggle" id="sidebarToggle">菜单</button>

  <div class="container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-main">
        <h2>Layi's Records</h2>
        <div id="categoryContainer"></div>
      </div>

      <div class="sidebar-footer">
        <input type="text" id="searchInput" class="search-input" placeholder="搜索标题/正文关键词...">
        <button class="theme-btn" id="themeBtn">加载中...</button>
        <button class="random-mini-btn" onclick="showRandomPost()">随机</button>
      </div>
    </div>

    <div class="main">
      <div id="fallbackBox">
        <h3 style="margin-bottom: 8px; color: var(--btn-text);">📂 本地离线文件手动加载</h3>
        <p style="font-size: 14px; color: var(--muted); margin-bottom: 10px;">
          提示：若在本地双击打开网页，可按需导入对应的 JSON 数据文件：
        </p>
        
        <div class="fallback-file-item">
          <label><b>1. 导入文章库 (posts.json)：</b> <span id="statusPosts" style="color:green;font-size:13px;"></span></label><br>
          <input type="file" accept=".json" onchange="handleLocalJson(this, 'POSTS')" style="margin-top:6px;">
        </div>

        <div class="fallback-file-item" style="margin-top: 10px;">
          <label><b>2. 导入想法库 (thoughts.json)：</b> <span id="statusThoughts" style="color:green;font-size:13px;"></span></label><br>
          <input type="file" accept=".json" onchange="handleLocalJson(this, 'THOUGHTS')" style="margin-top:6px;">
        </div>
      </div>

      <div id="list"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    // 使用 ES6+ 语法规范作用域，避免全局污染
    let allPosts = [], allThoughts = [], allLabels = [];
    let activeCategory = ''; 
    let currentPage = 1;
    const pageSize = 25, COLLAPSE_HEIGHT = 640;
    let filteredPosts = [];
    let searchInput = null, searchTimer = null;
    const themeBtn = document.getElementById('themeBtn');

    // 侧边栏 Toggle
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
    });

    // 随机展示
    function showRandomPost() {
      if (!filteredPosts || filteredPosts.length === 0) return;
      const post = filteredPosts[Math.floor(Math.random() * filteredPosts.length)];
      filteredPosts = [post];
      currentPage = 1;
      renderPage();
    }

    // 主题控制
    function applyTheme(theme) {
      const htmlEl = document.documentElement;
      if (theme === 'dark') {
        htmlEl.setAttribute('data-theme', 'dark');
        themeBtn.textContent = "夜间模式";
      } else if (theme === 'eink') {
        htmlEl.setAttribute('data-theme', 'eink');
        themeBtn.textContent = "E-Ink模式";
      } else {
        htmlEl.removeAttribute('data-theme');
        themeBtn.textContent = "日间模式";
      }
      localStorage.setItem('theme', theme);
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    applyTheme(savedTheme);

    themeBtn.addEventListener('click', () => {
      const current = localStorage.getItem('theme') || 'light';
      if (current === 'light') applyTheme('dark');
      else if (current === 'dark') applyTheme('eink');
      else applyTheme('light');
    });

    // 搜索初始化与防抖
    function initSearch() {
      searchInput = document.getElementById('searchInput');
      searchInput.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(doSearch, 200); 
      });
    }

    function doSearch() {
      const keyword = searchInput.value.trim().toLowerCase();
      currentPage = 1;
      const targetList = (activeCategory === 'THOUGHTS') ? allThoughts : allPosts;
      
      if (!keyword) {
        selectCategory(activeCategory);
        return;
      }
      
      // 使用更直观的 .includes()
      filteredPosts = targetList.filter(post => {
        const title = (post.title || '').toLowerCase();
        const body = (post.body || '').toLowerCase();
        return title.includes(keyword) || body.includes(keyword); 
      });
      renderPage();
    }

    // 核心初始化
    function init() {
      initSearch();
      tryAutoLoadServerFiles();
    }

    // 自动加载逻辑优化：加入了 xhr.status === 0 以兼容纯本地 file:// 协议直接读取
    function tryAutoLoadServerFiles() {
      const xhr = new XMLHttpRequest();
      xhr.open('GET', './posts.json', true);
      xhr.onreadystatechange = () => {
        if (xhr.readyState === 4 && (xhr.status === 200 || xhr.status === 0)) { 
          try { 
            const data = JSON.parse(xhr.responseText); 
            if (data && data.length > 0) {
              allPosts = data;
              handleDataReady();
            }
          } catch(e) {
            // 解析失败不报错，保留 Fallback 手动上传框
          }
        }
      };
      xhr.send(null);
    }

    function handleDataReady() {
      document.getElementById('fallbackBox').style.display = 'none';

      const tagSet = new Set();
      allPosts.forEach(post => {
        (post.labels || []).forEach(label => tagSet.add(label));
      });
      allLabels = Array.from(tagSet);
      
      renderCategory();
      
      if (!activeCategory) {
        if (allLabels.length > 0) selectCategory(allLabels[0]);
        else if (allThoughts.length > 0) selectCategory('THOUGHTS');
      } else {
        selectCategory(activeCategory);
      }
    }

    // DRY: 合并 Posts 和 Thoughts 的手动上传逻辑
    function handleLocalJson(input, type) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.readAsText(file, 'UTF-8');
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!Array.isArray(parsed)) {
            alert(`错误：上传的 JSON 根节点必须是数组！`);
            return;
          }
          
          if (type === 'THOUGHTS') {
            allThoughts = parsed.sort((a, b) => b.title.localeCompare(a.title, undefined, {numeric: true, sensitivity: 'base'}));
            document.getElementById('statusThoughts').textContent = `✔ 已加载 (${allThoughts.length}条)`;
          } else {
            allPosts = parsed;
            document.getElementById('statusPosts').textContent = `✔ 已加载 (${allPosts.length}篇)`;
          }
          handleDataReady();
        } catch (err) { 
          alert('JSON 解析失败，请检查文件格式。'); 
        }
      };
    }

    function renderCategory() {
      const container = document.getElementById('categoryContainer');
      const fragment = document.createDocumentFragment(); 

      allLabels.forEach(tag => {
        const div = document.createElement('div');
        div.className = 'category-item';
        div.textContent = tag;
        div.onclick = (e) => selectCategory(tag, e);
        fragment.appendChild(div);
      });

      if (allThoughts.length > 0) {
        const thoughtsDiv = document.createElement('div');
        thoughtsDiv.className = 'category-item';
        thoughtsDiv.textContent = '想法';
        thoughtsDiv.onclick = (e) => selectCategory('THOUGHTS', e);
        fragment.appendChild(thoughtsDiv);
      }

      container.innerHTML = '';
      container.appendChild(fragment); 
    }

    function selectCategory(cat, eventObj) {
      activeCategory = cat;
      
      document.querySelectorAll('.category-item').forEach(el => {
        el.classList.remove('active');
        if ((cat === 'THOUGHTS' && el.textContent === '想法') || (el.textContent === cat)) {
          el.classList.add('active');
        }
      });

      if (eventObj && eventObj.currentTarget) {
        document.querySelectorAll('.category-item').forEach(el => el.classList.remove('active'));
        eventObj.currentTarget.classList.add('active');
      }
      
      if (searchInput) searchInput.value = '';
      currentPage = 1;

      if (cat === 'THOUGHTS') {
        filteredPosts = [...allThoughts]; // 解构赋值替代 slice
      } else {
        filteredPosts = allPosts.filter(item => (item.labels || []).includes(cat));
      }

      renderPage();
    }

    function renderPage() {
      const total = Math.ceil(filteredPosts.length / pageSize);
      if (total > 0 && currentPage > total) {
        currentPage = total;
      }
      const start = (currentPage - 1) * pageSize;
      renderPosts(filteredPosts.slice(start, start + pageSize));
      renderPagination(total);
    }

    function renderPosts(posts) {
      const listEl = document.getElementById('list');
      if (!listEl) return;
      
      if (posts.length === 0) {
        listEl.innerHTML = `<p style="text-align:left;margin-top:20px;color:var(--text)">当前分类下暂无内容</p>`;
        return;
      }
      
      const isThoughtView = (activeCategory === 'THOUGHTS');
      
      // 核心优化：利用模板字符串(Template Literals)和 map 生成 DOM 结构，大幅提升可读性
      // 使用 marked 原生 breaks:true，替代容易破坏代码块的 .replace(/\n/g, '<br>')
      listEl.innerHTML = posts.map((art, i) => {
        const id = i + 1;
        const title = art.title || '';
        const bodyContent = art.body || '';
        const parsedBody = marked.parse(bodyContent, { breaks: true });
        
        if (!isThoughtView) {
          return `
            <div class="post">
              <h2>${title}</h2>
              <div class="post-content" id="b${id}">${parsedBody}</div>
              <button class="toggle-btn" id="tb${id}" onclick="toggleBody(${id})">阅读全文</button>
            </div>
          `;
        } else {
          return `
            <div class="post">
              <div class="post-content" id="b${id}">${parsedBody}</div>
              <div class="thought-meta">── ${title}</div>
              <button class="toggle-btn" id="tb${id}" onclick="toggleBody(${id})">阅读全文</button>
            </div>
          `;
        }
      }).join(''); 

      listEl.querySelectorAll('.post-content').forEach(el => {
        if (el.scrollHeight > COLLAPSE_HEIGHT) {
          el.classList.add("collapsible");
        }
      });
    }

    function toggleBody(id) {
      const el = document.getElementById(`b${id}`);
      const btn = document.getElementById(`tb${id}`);
      if (!el || !btn) return;
      
      el.classList.toggle("expand");
      if (el.classList.contains("expand")) {
        btn.textContent = "收起";
        el.classList.remove("collapsible");
      } else {
        btn.textContent = "阅读全文";
        if (el.scrollHeight > COLLAPSE_HEIGHT) {
          el.classList.add("collapsible");
        }
      }
    }

    function jumpToPage() {
      const total = Math.ceil(filteredPosts.length / pageSize);
      const input = document.getElementById('jumpInput');
      if (!input) return;
      let page = parseInt(input.value.trim(), 10);
      if (isNaN(page)) return;
      page = Math.max(1, Math.min(page, total));
      currentPage = page;
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderPagination(total) {
      const wrap = document.getElementById('pagination');
      if (!wrap) return;
      if (total <= 1) {
        wrap.innerHTML = '';
        return;
      }
      
      wrap.innerHTML = `
        <button class="page-btn" onclick="prev()" ${currentPage === 1 ? 'disabled' : ''}>上一页</button>
        <span>${currentPage}/${total}</span>
        <button class="page-btn" onclick="next()" ${currentPage === total ? 'disabled' : ''}>下一页</button>
        <input type="number" class="jump-input" id="jumpInput" min="1" max="${total}" placeholder="页码" />
        <button class="page-btn" onclick="jumpToPage()">跳转</button>
      `;
      
      const jumpInputEl = document.getElementById('jumpInput');
      if (jumpInputEl) {
        jumpInputEl.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') jumpToPage();
        });
      }
    }

    function prev() { 
      currentPage--; 
      renderPage(); 
      window.scrollTo({top:0, behavior:'smooth'});
    }
    
    function next() { 
      currentPage++; 
      renderPage(); 
      window.scrollTo({top:0, behavior:'smooth'});
    }
    
    // 启动
    init();
  </script>
</body>
</html>
