<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eskiry's Blog</title>
  <style>
    body { max-width: 800px; margin: 0 auto; padding: 20px; font-family: "Noto Sans SC", sans-serif; line-height: 1.8; }
    .post { border-bottom: 1px solid #eee; padding: 20px 0; margin-bottom: 20px; }
    .post h2 { margin: 0 0 15px 0; color: #24292e; }
    .post-content { color: #24292e; }
    pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; }
    code { background: #f6f8fa; padding: 2px 4px; border-radius: 4px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <h1>Eskiry's Blog</h1>
  <div id="posts"></div>

  <script>
    // 拉取你的所有 Issues 并显示全文
    fetch("https://api.github.com/repos/Eskiry/eskiry.github.io/issues?state=all&per_page=100")
      .then(res => res.json())
      .then(posts => {
        const postsContainer = document.getElementById('posts');
        posts.forEach(post => {
          const postDiv = document.createElement('div');
          postDiv.className = 'post';
          // 渲染完整 Markdown 内容
          postDiv.innerHTML = `
            <h2>${post.title}</h2>
            <div class="post-content">${marked.parse(post.body)}</div>
          `;
          postsContainer.appendChild(postDiv);
        });
      });
  </script>
</body>
</html>
