<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TXT批量转JSON摘录工具</title>
<style>
body{font-family:"微软雅黑",sans-serif;padding:30px;max-width:1000px;margin:0 auto;background:#f5f7fa;}
.container{background:#fff;padding:25px;border-radius:10px;box-shadow:0 2px 15px #ddd;}
h3{margin-top:0;color:#333;}
textarea,input{width:100%;padding:12px;margin:8px 0;border:1px #ccc solid;border-radius:6px;box-sizing:border-box;font-size:14px;}
textarea{height:160px;resize:vertical;}
input{height:42px;}
button{padding:10px 18px;margin:6px 4px;border:none;border-radius:6px;background:#2d8cf0;color:#fff;cursor:pointer;font-size:14px;}
button:hover{background:#1b76d8;}
.upload-box{padding:15px;border:2px dashed #999;border-radius:6px;margin:15px 0;}
.list{margin-top:20px;padding:15px;background:#fafafa;border-radius:6px;max-height:320px;overflow:auto;}
.item{padding:10px;border-bottom:1px #eee dashed;line-height:1.6;}
</style>
</head>
<body>
<div class="container">
    <h3>📁 上传TXT批量导入 / 手动录入摘录</h3>

    <!-- 上传TXT区域 -->
    <div class="upload-box">
        <input type="file" id="txtFile" accept=".txt">
        <p>格式要求：每条摘录空行分隔，正文———标题（和你现在的txt格式一致）</p>
        <button onclick="uploadTxt()">解析TXT并导入</button>
    </div>

    <h4>手动单条补充录入</h4>
    <input type="text" id="title" placeholder="标题：《时尚的迷宫》[日]鹫田清一，留空默认Paragraph">
    <textarea id="body" placeholder="粘贴摘录正文内容"></textarea>

    <div>
        <button onclick="addItem()">添加本条</button>
        <button onclick="exportJson()">导出JSON文件</button>
        <button onclick="clearInput()">清空输入</button>
        <button onclick="clearAll()">清空全部数据</button>
    </div>

    <div class="list" id="listBox">
        <div>已加载条目列表：</div>
    </div>
</div>

<script>
let dataList = [];

// 上传并解析TXT
function uploadTxt(){
    const fileInput = document.getElementById('txtFile');
    const file = fileInput.files[0];
    if(!file){
        alert('请先选择你的txt文件！');
        return;
    }
    const reader = new FileReader();
    reader.readAsText(file, 'UTF-8');
    reader.onload = function(e){
        const text = e.target.result;
        // 按空行分割每条
        const blocks = text.split(/\n\s*\n/).filter(b => b.trim());
        let count = 0;
        blocks.forEach(blk => {
            blk = blk.trim();
            let title, body;
            if(blk.includes('———')){
                let parts = blk.split('———', 2);
                body = parts[0].trim();
                title = parts[1].trim();
            }else{
                body = blk.trim();
                title = "Paragraph";
            }
            if(body){
                dataList.push({
                    title: title,
                    body: body,
                    labels: ["摘录"]
                });
                count++;
            }
        });
        refreshList();
        alert(`解析完成！成功导入 ${count} 条摘录`);
    }
}

// 手动添加单条
function addItem(){
    let title = document.getElementById('title').value.trim();
    let body = document.getElementById('body').value.trim();
    if(!body){
        alert('请输入正文内容！');
        return;
    }
    if(!title) title = "Paragraph";

    dataList.push({
        title: title,
        body: body,
        labels: ["摘录"]
    });
    refreshList();
    clearInput();
    alert('添加成功！');
}

// 刷新列表预览
function refreshList(){
    let html = "已加载条目列表：<br><br>";
    dataList.forEach((item,idx)=>{
        html += `<div class="item">
            ${idx+1}. <b>标题：</b>${item.title}<br>
            <b>正文：</b>${item.body.slice(0,30)}...
        </div>`;
    });
    document.getElementById('listBox').innerHTML = html;
}

// 导出JSON
function exportJson(){
    if(dataList.length===0){
        alert('暂无数据可导出！');
        return;
    }
    let jsonStr = JSON.stringify(dataList, null, 2);
    let blob = new Blob([jsonStr], {type:'application/json'});
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '摘录数据.json';
    a.click();
}

// 清空输入框
function clearInput(){
    document.getElementById('title').value = '';
    document.getElementById('body').value = '';
}

// 清空所有数据
function clearAll(){
    if(confirm('确定清空所有已导入的摘录吗？不可恢复！')){
        dataList = [];
        refreshList();
    }
}
</script>
</body>
</html>
